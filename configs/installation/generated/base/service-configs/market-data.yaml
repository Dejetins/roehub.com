market_data:
  backfill:
    chunk_align: utc_day
    max_days_per_insert: 7
  ingestion:
    bootstrap_history_lookback_minutes: 10080
    flush_interval_ms: 250
    max_buffer_rows: 3000
    rest_concurrency_instruments: 4
    rest_inter_instrument_delay_s: 2.0
    tail_lookback_minutes: 10080
  live_feed:
    redis_hot_cache:
      enabled: true
      host: redis
      key_prefix: md:hot:1m
      retention_hours: 24
    redis_streams:
      connect_timeout_s: 2.0
      db: 0
      enabled: true
      host: redis
      password_env: ROEHUB_REDIS_PASSWORD
      port: 6379
      retention_days: 7
      socket_timeout_s: 2.0
      stream_mode: per_instrument
      stream_prefix: md.candles.1m
  markets:
  - exchange: binance
    market_code: binance:spot
    market_id: 1
    market_type: spot
    rest:
      backoff:
        base_s: 0.5
        jitter_s: 0.3
        max_s: 15.0
      base_url: https://api.binance.com
      earliest_available_ts_utc: '2017-01-01T00:00:00Z'
      limiter:
        max_concurrency: 3
        mode: autodetect
        safety_factor: 0.7
      retries: 5
      timeout_s: 15.0
    ws:
      max_symbols_per_connection: 200
      ping_interval_s: 20.0
      pong_timeout_s: 10.0
      reconnect:
        factor: 1.7
        jitter_s: 0.3
        max_delay_s: 60.0
        min_delay_s: 0.5
      url: wss://stream.binance.com:9443/stream
  - exchange: binance
    market_code: binance:futures
    market_id: 2
    market_type: futures
    rest:
      backoff:
        base_s: 0.5
        jitter_s: 0.3
        max_s: 15.0
      base_url: https://fapi.binance.com
      earliest_available_ts_utc: '2019-09-01T00:00:00Z'
      limiter:
        max_concurrency: 3
        mode: autodetect
        safety_factor: 0.7
      retries: 5
      timeout_s: 15.0
    ws:
      max_symbols_per_connection: 200
      ping_interval_s: 20.0
      pong_timeout_s: 10.0
      reconnect:
        factor: 1.7
        jitter_s: 0.3
        max_delay_s: 60.0
        min_delay_s: 0.5
      url: wss://fstream.binance.com/market/stream
  - exchange: bybit
    market_code: bybit:spot
    market_id: 3
    market_type: spot
    rest:
      backoff:
        base_s: 0.5
        jitter_s: 0.3
        max_s: 15.0
      base_url: https://api.bybit.com
      earliest_available_ts_utc: '2018-01-01T00:00:00Z'
      limiter:
        max_concurrency: 3
        mode: autodetect
        safety_factor: 0.7
      retries: 5
      timeout_s: 15.0
    ws:
      max_symbols_per_connection: 10
      ping_interval_s: 20.0
      pong_timeout_s: 10.0
      reconnect:
        factor: 1.7
        jitter_s: 0.3
        max_delay_s: 60.0
        min_delay_s: 0.5
      url: wss://stream.bybit.com/v5/public/spot
  - exchange: bybit
    market_code: bybit:futures
    market_id: 4
    market_type: futures
    rest:
      backoff:
        base_s: 0.5
        jitter_s: 0.3
        max_s: 15.0
      base_url: https://api.bybit.com
      earliest_available_ts_utc: '2018-01-01T00:00:00Z'
      limiter:
        max_concurrency: 3
        mode: autodetect
        safety_factor: 0.7
      retries: 5
      timeout_s: 15.0
    ws:
      max_symbols_per_connection: 200
      ping_interval_s: 20.0
      pong_timeout_s: 10.0
      reconnect:
        factor: 1.7
        jitter_s: 0.3
        max_delay_s: 60.0
        min_delay_s: 0.5
      url: wss://stream.bybit.com/v5/public/linear
  scheduler:
    jobs:
      enrich:
        interval_seconds: 43200
      funding_rate_catchup:
        allow_binance_funding_info_failure_fallback: false
        batch_size: 1000
        binance_standard_interval_hours: 8
        due_mode: due_only
        enabled: true
        gap_audit_lookback_intervals: 21
        interval_seconds: 1800
        settlement_lag_minutes: 10
        startup_bootstrap: true
        tail_lookback_intervals: 3
        universe_refresh_interval_seconds: 21600
      refresh_catalog:
        interval_seconds: 60
      rest_insurance_catchup:
        enabled: false
        interval_seconds: 3600
version: 1
