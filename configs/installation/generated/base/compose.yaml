name: roehub-base
networks:
  roehub:
    internal: true
    labels:
      io.roehub.profile: base
      io.roehub.trust-boundary: installation-internal
  web-ingress:
    internal: false
    labels:
      io.roehub.ingress-purpose: host-web-ui-only
      io.roehub.profile: base
      io.roehub.trust-boundary: web-ingress
services:
  alertmanager:
    cap_drop: &id001
    - ALL
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    networks: &id002
    - roehub
    read_only: true
    restart: unless-stopped
    security_opt: &id003
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    user: 65534:65534
    volumes:
    - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager-data:/alertmanager
  api:
    cap_drop:
    - ALL
    command:
    - python
    - -m
    - apps.api.main.main
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-migrations:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    environment:
      EXTENSIONS_PG_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      IDENTITY_EXCHANGE_KEYS_KEK_B64_FILE: /run/roehub-secrets/identity-exchange-kek
      IDENTITY_FAIL_FAST: 'true'
      IDENTITY_LOCAL_ALLOW_INSECURE_LOCALHOST: 'true'
      IDENTITY_LOCAL_ORIGIN: http://localhost:8080
      IDENTITY_LOCAL_RP_ID: localhost
      IDENTITY_LOCAL_RP_NAME: Roehub
      IDENTITY_PG_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      IDENTITY_SESSION_ABSOLUTE_TTL_SECONDS: '43200'
      IDENTITY_SESSION_IDLE_TTL_SECONDS: '1800'
      NOTIFICATIONS_PG_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      NUMBA_CACHE_DIR: /tmp/roehub-numba-cache
      PGPASSFILE: /run/roehub-secrets/pgpass
      POSTGRES_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      PYTHONUNBUFFERED: '1'
      ROEHUB_ENV: prod
      ROEHUB_EXCHANGE_ACCOUNT_STATE_SYNC_ENABLED: 'false'
      ROEHUB_EXCHANGE_CONNECTIONS_PUBLIC_ROUTES_ENABLED: 'false'
      ROEHUB_EXCHANGE_CONTROL_INTERNAL_API_TOKEN_FILE: /run/roehub-secrets/exchange-control-internal-api-token
      ROEHUB_EXCHANGE_CONTROL_INTERNAL_BASE_URL: http://exchange-control:9205
      ROEHUB_EXCHANGE_CONTROL_REAL_EXCHANGE_VALIDATION_ENABLED: 'false'
      ROEHUB_EXCHANGE_EXECUTION_CONFIG: /etc/roehub/exchange-execution.yaml
      ROEHUB_EXECUTION_STRATEGY_PRODUCER_ENABLED: 'false'
      ROEHUB_NUMBA_CACHE_DIR: /tmp/roehub-numba-cache
      ROEHUB_OPERATIONAL_HEALTH_URL: http://operational-health:9300
      ROEHUB_PLUGIN_BUNDLE_SPOOL_ROOT: /var/lib/roehub/artifacts/plugin-bundles
      ROEHUB_PLUGIN_GATEWAY_URL: http://plugin-gateway:9209
      ROEHUB_PLUGIN_PUBLISHER_KEYS_FILE: /etc/roehub/plugin-publisher-keys.json
      ROEHUB_PLUGIN_UNSIGNED_DEVELOPMENT: 'false'
      ROEHUB_PROFILE: base
      ROEHUB_REDIS_HOST: redis
      ROEHUB_REDIS_PASSWORD_FILE: /run/roehub-secrets/redis-password
      ROEHUB_REDIS_PORT: '6379'
      ROEHUB_STORAGE_POSTGRES_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      ROEHUB_STORAGE_REDIS_URL: redis://redis:6379/0
      ROEHUB_STRATEGY_CONFIG: /etc/roehub/strategy.yaml
      STRATEGY_PG_DSN: host=postgresql port=5432 dbname=roehub user=roehub
      WEB_API_BASE_URL: http://web:8010
      WEB_API_UPSTREAM_URL: http://api:8000
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read(1)
      timeout: 3s
    image: roehub/runtime@sha256:35ad7fdd77e6aa6cbbcf5fc20b29184277b4400d0e8c97c24f46876a061b352f
    init: true
    labels:
      io.roehub.lifecycle: service
      io.roehub.profile: base
      io.roehub.role: api
    networks:
    - roehub
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /run:rw,noexec,nosuid,size=16m
    user: 65532:65532
    volumes:
    - ./service-config.json:/etc/roehub/service-config.json:ro
    - ./service-configs/indicators.yaml:/etc/roehub/indicators.yaml:ro
    - ./service-configs/market_data.yaml:/etc/roehub/market_data.yaml:ro
    - runtime-secrets:/run/roehub-secrets:ro
    - ./service-configs/plugin-publisher-keys.json:/etc/roehub/plugin-publisher-keys.json:ro
    - ./service-configs/strategy.yaml:/etc/roehub/strategy.yaml:ro
    - artifacts:/var/lib/roehub/artifacts
