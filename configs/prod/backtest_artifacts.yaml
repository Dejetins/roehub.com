version: 1
backtest_artifacts:
  artifact_root: /opt/roehub/state/backtest_artifacts/v2
  validation_plan:
    price_timeframes:
      - 1m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 6h
      - 8h
      - 1d
      - 2d
      - 3d
    mapping_timeframes:
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 6h
      - 8h
      - 1d
      - 2d
      - 3d
    signal_artifacts: all_supported_v1
    require_hit_times_manifest: true
  hit_times_grid:
    tp_levels_pct:
      - 0.5
      - 1.0
      - 1.5
      - 2.0
      - 3.0
    sl_levels_pct:
      - 0.5
      - 1.0
      - 1.5
      - 2.0
      - 3.0
  slot_policy:
    slots:
      - slot_a
      - slot_b
  publish_schedule:
    full_rebuild_hour_utc: 2
    full_rebuild_minute_utc: 0
  lookback_policy:
    price_tail_bars_1m: 20000
    mapping_tail_bars_1m: 20000
    signal_tail_bars_1m: 20000
    hit_times_tail_bars_1m: 20000
  validation_budgets:
    max_price_bars_per_timeframe: 5000000
    max_mapping_rows_per_timeframe: 5000000
    max_signal_rows_per_artifact: 5000000
    max_hit_times_cells: 50000000
    max_hit_times_cells_full_rebuild: 150000000
  execution_policy:
    # R12-03 timeframe-local order:
    # canonical_prices -> hit_times -> rolled_prices/timeframe_session per target timeframe.
    # Progress is emitted via structured logs: current_timeframe, current_indicator_id,
    # completed_chunks_total, completed_indicators_total.
    max_open_timeframe_sessions: 1
    signal_worker_processes: 4
    signal_worker_memory_budget_bytes: 2147483648
    signal_chunk_rows_min: 32
    signal_chunk_rows_max: 256
