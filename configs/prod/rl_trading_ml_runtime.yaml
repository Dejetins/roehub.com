---
profile: prod
artifact_root: /opt/roehub/state/rl_trading
device_policy: mps_preferred_cpu_fallback
trainer:
  enabled: false
  max_concurrent_jobs: 1
  torch_num_threads: 4
  torch_num_interop_threads: 1
  max_rss_mb: 32768
  nice: 10
inference:
  enabled: false
  max_concurrent_processes: 1
  torch_num_threads: 1
  torch_num_interop_threads: 1
  max_rss_mb: 4096
backtest_jobs:
  max_concurrent_when_training: 1
  max_concurrent_when_inference_only: 2
disk:
  min_free_gb: 100
  block_training_below_free_gb: 150
  cleanup_may_delete_accepted_artifacts: false
runtime_artifacts:
  commit_to_git: false
  allowed_root: /opt/roehub/state/rl_trading
