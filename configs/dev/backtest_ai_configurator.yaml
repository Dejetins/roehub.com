      max_active_user_jobs: 1
    pro:
      requests_per_5h: 15
      requests_per_week: 75
      max_queued_per_user: 3
      max_active_user_jobs: 1
    ultra:
      requests_per_5h: 40
      requests_per_week: 200
      max_queued_per_user: 5
      max_active_user_jobs: 1
