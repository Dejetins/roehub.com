version: 1
backtest:
  warmup_bars_default: 200
  top_k_default: 300
  preselect_default: 20000
  ranking:
    primary_metric_default: total_return_pct
    secondary_metric_default: null
  contracts:
    request_timeframes:
      allowed:
        - 15m
        - 30m
        - 1h
        - 2h
        - 4h
        - 6h
        - 8h
        - 1d
        - 2d
        - 3d
      forbidden:
        - 1m
        - 5m
    summary:
      top_n_default: 100
      top_n_max: 300
      ranking_metrics:
        - total_return_pct
        - max_drawdown_pct
        - return_over_max_drawdown
        - profit_factor
        - sharpe_trades
        - win_rate_pct
      sortable_columns:
        - total_return_pct
        - max_drawdown_pct
        - return_over_max_drawdown
        - profit_factor
        - sharpe_trades
        - win_rate_pct
        - trade_count
        - avg_trade_ret_pct
        - avg_trade_exec_bars
        - exposure_pct
        - best_tp_pct
        - best_sl_pct
    signals:
      params_path: signals.v1.params
      params_policy: default-only
    execution:
      risk_model: signal_tf + 1m_risk
    launch:
      execution_mode: auto
      auto_preflight_enabled: true
      auto_fallback_to_background_enabled: true
  guards:
    max_variants_per_compute: 600000
    max_compute_bytes_total: 5368709120
  cpu:
    max_numba_threads: 4
  sync:
    sync_deadline_seconds: 55.0
  jobs:
    enabled: true
    top_k_persisted_default: 300
    max_active_jobs_per_user: 3
    claim_poll_seconds: 1.0
    lease_seconds: 60
    heartbeat_seconds: 15
    snapshot_seconds: 30
    snapshot_variants_step: 1000
    parallel_workers: 1
  reporting:
    top_trades_n_default: 3
    eager_top_reports_enabled: false
  execution:
    init_cash_quote_default: 10000
    fixed_quote_default: 100
    safe_profit_percent_default: 30.0
    slippage_pct_default: 0.01
    fee_pct_default_by_market_id:
      1: 0.075
      2: 0.1
      3: 0.075
      4: 0.1
