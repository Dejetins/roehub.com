---
profile: dev
artifact_root: /opt/roehub/state/rl_trading
device_policy: mps_preferred_cpu_fallback
trainer:
  enabled: false
  max_concurrent_jobs: 1
  torch_num_threads: 2
  torch_num_interop_threads: 1
  max_rss_mb: 8192
  nice: 10
retraining:
  enabled: false
  manual_trigger:
    enabled: false
    host_local_cli_only: true
  scheduled_trigger:
    enabled: false
    schedule_id: null
  drift_trigger:
    creates_candidate_task: true
    auto_promote: false
  allowed_modes:
    - full_retrain
    - fine_tune
  max_concurrent_candidate_jobs: 1
promotion:
  auto_promote: false
  require_operator_approval: true
  require_admin_approval: true
  threshold_profile: stage10a_promotion_threshold_profile_v1
rollback:
  host_local_command_enabled: true
  delete_artifacts_on_rollback: false
inference:
  enabled: false
  mode: monitor_only
  metrics_port: 9213
  health_check_enabled: true
  max_concurrent_processes: 1
  torch_num_threads: 1
  torch_num_interop_threads: 1
  max_rss_mb: 2048
  source_events:
    enabled: false
    source_type: ml_agent_decision
    outcome: no_intent
    outcome_reason: monitor_only_no_intent
  redis_streams:
    enabled: true
    host: 127.0.0.1
    port: 6379
    db: 0
    auth_env: null
    socket_timeout_s: 2.0
    connect_timeout_s: 2.0
    stream_prefix: md.candles.1m
    window_size: 30
  latency_budget_ms:
    candle_close_to_feature_ready_p95: 250
    feature_to_decision_p95: 100
    decision_to_source_event_p95: 50
backtest_jobs:
  max_concurrent_when_training: 1
  max_concurrent_when_inference_only: 1
disk:
  min_free_gb: 40
  block_training_below_free_gb: 60
  cleanup_may_delete_accepted_artifacts: false
runtime_artifacts:
  commit_to_git: false
  allowed_root: /opt/roehub/state/rl_trading
