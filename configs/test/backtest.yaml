version: 1
backtest:
  warmup_bars_default: 200
  top_k_default: 300
  preselect_default: 20000
  ranking:
    primary_metric_default: total_return_pct
    secondary_metric_default: null
  contracts:
    request_timeframes:
      allowed:
        - 15m
        - 30m
        - 1h
        - 2h
        - 4h
        - 6h
        - 8h
        - 1d
        - 2d
        - 3d
      forbidden:
        - 1m
        - 5m
    summary:
      top_n_default: 100
      top_n_max: 300
      ranking_metrics:
        - total_return_pct
        - max_drawdown_pct
        - return_over_max_drawdown
        - profit_factor
        - sharpe_trades
        - win_rate_pct
      sortable_columns:
        - total_return_pct
        - max_drawdown_pct
        - return_over_max_drawdown
        - profit_factor
        - sharpe_trades
        - win_rate_pct
        - trade_count
        - avg_trade_ret_pct
        - avg_trade_exec_bars
        - exposure_pct
        - best_tp_pct
        - best_sl_pct
    signals:
      params_path: signals.v1.params
      params_policy: default-only
    execution:
      risk_model: signal_tf + 1m_risk
    launch:
      execution_mode: auto
      auto_preflight_enabled: true
      auto_fallback_to_background_enabled: true
  execution_profiles:
    default: exact_small
    adaptive_selector:
      mode: shadow  # test stays recommendation-only ahead of the explicit opt_in prod phase.
      hybrid_conservative:
        rollout_mode: active
        min_grid_cardinality: 6000
        min_stage_a_variants_total: 6000
        min_stage_b_variants_total: 40000
        min_estimated_memory_bytes: 805306368
        minimum_exceeded_signals: 3
      hybrid_family:
        rollout_mode: shadow
        min_grid_cardinality: 12000
        min_stage_a_variants_total: 12000
        min_stage_b_variants_total: 80000
        min_estimated_memory_bytes: 1073741824
        minimum_exceeded_signals: 3
    profiles:
      - mode: exact_small
        family_plugin_budget_ms: 10
        planning_budget_ms: 25
        shortlist:
          enabled: false
          scoring:
            activity_ratio_weight: 0.40
            direction_balance_weight: 0.25
            transition_ratio_weight: 0.25
            active_span_ratio_weight: 0.10
          retention:
            diversity_buckets:
              - activity_band
              - direction_band
        launch_budget:
          max_stage_a_variants_total: 1500
          max_stage_b_variants_total: 12000
          max_estimated_memory_bytes: 268435456
        progress:
          stage_a: 40
          stage_b: 55
          finalizing: 5
        parallelism:
          stage_a_workers: 1
          stage_b_workers: 1
        feature_flags:
          runtime_enabled: true
          heuristic_shortlist_enabled: false
          parallel_stage_b_enabled: false
          family_plugin_enabled: false
        stage_b_process_fallback:
          min_stage_b_variants_total: 12000
      - mode: exact_parallel
        family_plugin_budget_ms: 20
        planning_budget_ms: 50
        shortlist:
          enabled: false
          scoring:
            activity_ratio_weight: 0.40
            direction_balance_weight: 0.25
            transition_ratio_weight: 0.25
            active_span_ratio_weight: 0.10
          retention:
            diversity_buckets:
              - activity_band
              - direction_band
        launch_budget:
          max_stage_a_variants_total: 25000
          max_stage_b_variants_total: 180000
          max_estimated_memory_bytes: 1610612736
        progress:
          stage_a: 45
          stage_b: 50
          finalizing: 5
        parallelism:
          stage_a_workers: 4
          stage_b_workers: 4
        feature_flags:
          runtime_enabled: true
          heuristic_shortlist_enabled: false
          parallel_stage_b_enabled: true
          family_plugin_enabled: false
        stage_b_process_fallback:
          min_stage_b_variants_total: 150000
      - mode: hybrid_conservative
        family_plugin_budget_ms: 30
        planning_budget_ms: 75
        shortlist:
          enabled: true
          max_candidates: 5000
          scoring:
            activity_ratio_weight: 0.40
            direction_balance_weight: 0.25
            transition_ratio_weight: 0.25
            active_span_ratio_weight: 0.10
          retention:
            diversity_buckets:
              - activity_band
              - direction_band
            max_per_bucket: 750
        launch_budget:
          max_stage_a_variants_total: 50000
          max_stage_b_variants_total: 250000
          max_estimated_memory_bytes: 2147483648
        progress:
          stage_a: 55
          stage_b: 40
          finalizing: 5
        parallelism:
          stage_a_workers: 4
          stage_b_workers: 3
        feature_flags:
          runtime_enabled: true
          heuristic_shortlist_enabled: true
          parallel_stage_b_enabled: false
          family_plugin_enabled: false
        stage_b_process_fallback:
          min_stage_b_variants_total: 200000
      - mode: hybrid_family
        family_plugin_budget_ms: 40
        planning_budget_ms: 100
        shortlist:
          enabled: true
          max_candidates: 2000
          scoring:
            activity_ratio_weight: 0.35
            direction_balance_weight: 0.20
            transition_ratio_weight: 0.30
            active_span_ratio_weight: 0.15
          retention:
            diversity_buckets:
              - activity_band
              - transition_band
            max_per_bucket: 300
        launch_budget:
          max_stage_a_variants_total: 75000
          max_stage_b_variants_total: 300000
          max_estimated_memory_bytes: 2684354560
        progress:
          stage_a: 60
          stage_b: 35
          finalizing: 5
        parallelism:
          stage_a_workers: 3
          stage_b_workers: 2
        feature_flags:
          runtime_enabled: true
          heuristic_shortlist_enabled: true
          parallel_stage_b_enabled: false
          family_plugin_enabled: true
        stage_b_process_fallback:
          min_stage_b_variants_total: 240000
  guards:
    max_variants_per_compute: 60000000
    max_compute_bytes_total: 5368709120999999
  cpu:
    max_numba_threads: 4
  sync:
    sync_deadline_seconds: 9999.0
  jobs:
    enabled: true
    top_k_persisted_default: 300
    max_active_jobs_per_user: 3
    claim_poll_seconds: 1.0
    lease_seconds: 60
    heartbeat_seconds: 15
    snapshot_seconds: 30
    snapshot_variants_step: 1000
    worker_processes: 1
  reporting:
    top_trades_n_default: 3
    eager_top_reports_enabled: false
  execution:
    init_cash_quote_default: 10000
    fixed_quote_default: 100
    safe_profit_percent_default: 30.0
    slippage_pct_default: 0.01
    fee_pct_default_by_market_id:
      1: 0.075
      2: 0.1
      3: 0.075
      4: 0.1
