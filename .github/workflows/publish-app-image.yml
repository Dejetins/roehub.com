name: Publish App Image

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "src/**"
      - "configs/**"
      - "alembic/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/docker/Dockerfile.market_data"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image repo
        id: image_repo
        run: |
          set -euxo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repo=ghcr.io/${owner_lc}/roehub-app" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image_repo.outputs.image_repo }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.market_data
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=publish-app-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=publish-app-image-${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
