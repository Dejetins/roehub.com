name: Publish App Image

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web_image_changed: ${{ steps.filter.outputs.web_image_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect web image changes
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m tools.ci.route_changes web-image --changed-files /dev/null --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          else
            git ls-tree -r --name-only HEAD > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/  /' changed-files.txt
          python -m tools.ci.route_changes web-image --changed-files changed-files.txt >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      needs.changes.outputs.web_image_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image repo
        id: image_repo
        run: |
          set -euxo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repo=ghcr.io/${owner_lc}/roehub-app" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image_repo.outputs.image_repo }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.market_data
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=publish-app-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=publish-app-image-${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
