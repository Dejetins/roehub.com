name: Exchange Connection Cleanup Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Stage 09D cleanup operation"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "execute"
          - "metrics"
      repair_audit:
        description: "Repair missing archive audit events for already archived eligible cleanup rows"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: exchange-connection-cleanup-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, macOS, ARM64, roehub, prod, mac-studio]
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Run cleanup operation
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin

          if [ "${{ inputs.mode }}" = "metrics" ]; then
            curl -fsS http://127.0.0.1:9205/metrics \
              | grep '^exchange_connection_cleanup_total'
            exit 0
          fi

          cd /opt/roehub/app
          set -a
          source /Users/daniildegtyarev/.config/roehub/roehub.env
          set +a
          common_args=(
            --limit 100
            --source stage09d
            --exchange-control-url "${ROEHUB_EXCHANGE_CONTROL_INTERNAL_BASE_URL:-http://127.0.0.1:9205}"
          )
          /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
            --dry-run \
            "${common_args[@]}"
          if [ "${{ inputs.mode }}" = "execute" ]; then
            repair_args=()
            if [ "${{ inputs.repair_audit }}" = "true" ]; then
              repair_args=(--repair-archived-audit)
            fi
            /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
              --execute \
              "${common_args[@]}" \
              "${repair_args[@]}"
            /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
              --dry-run \
              "${common_args[@]}"
          fi
