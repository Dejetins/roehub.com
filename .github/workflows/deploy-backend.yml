name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "src/**"
      - "configs/**"
      - "alembic/**"
      - "alembic.ini"
      - "migrations/**"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/macos/**"
      - "infra/macos/**"
      - "infra/scripts/**"
      - "tests/perf_smoke/contexts/backtest/fixtures/backtest_runtime_acceleration_benchmark_corpus_v1.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, roehub, prod, mac-studio]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Show context
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          whoami
          id
          sw_vers
          uv --version
          tailscale version

      - name: Assert server prerequisites
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          command -v uv
          test -s /Users/daniildegtyarev/.config/roehub/roehub.env
          test -d /opt/roehub
          test -w /opt/roehub
          install -d /opt/roehub/app
          install -d /opt/roehub/config
          install -d /Users/daniildegtyarev/Library/LaunchAgents

      - name: Validate repo layout for native deploy
        run: |
          set -euxo pipefail
          for required_path in apps src configs alembic alembic.ini migrations scripts/macos infra/macos infra/scripts/monit .python-version pyproject.toml uv.lock tests/perf_smoke/contexts/backtest/fixtures/backtest_runtime_acceleration_benchmark_corpus_v1.json; do
            test -e "${required_path}"
          done

      - name: Sync backend source bundle
        run: |
          set -euxo pipefail
          install -d /opt/roehub/app
          if command -v rsync >/dev/null 2>&1; then
            rsync_flags=( -a --delete --exclude '__pycache__/' --exclude '*.py[cod]' )
            rsync "${rsync_flags[@]}" apps/ /opt/roehub/app/apps/
            rsync "${rsync_flags[@]}" src/ /opt/roehub/app/src/
            rsync "${rsync_flags[@]}" configs/ /opt/roehub/app/configs/
            rsync "${rsync_flags[@]}" alembic/ /opt/roehub/app/alembic/
            rsync "${rsync_flags[@]}" migrations/ /opt/roehub/app/migrations/
            rsync "${rsync_flags[@]}" scripts/macos/ /opt/roehub/app/scripts/macos/
            rsync "${rsync_flags[@]}" infra/macos/ /opt/roehub/app/infra/macos/
            rsync "${rsync_flags[@]}" infra/scripts/ /opt/roehub/app/infra/scripts/
          else
            rm -rf /opt/roehub/app/apps /opt/roehub/app/src /opt/roehub/app/configs /opt/roehub/app/alembic /opt/roehub/app/migrations /opt/roehub/app/scripts/macos /opt/roehub/app/infra/macos /opt/roehub/app/infra/scripts
            mkdir -p /opt/roehub/app/scripts /opt/roehub/app/infra
            tar -C . -cf - apps src configs alembic migrations scripts/macos infra/macos infra/scripts | tar -C /opt/roehub/app -xf -
          fi
          install -d /opt/roehub/app/tests/perf_smoke/contexts/backtest/fixtures
          install -m 0644 tests/perf_smoke/contexts/backtest/fixtures/backtest_runtime_acceleration_benchmark_corpus_v1.json /opt/roehub/app/tests/perf_smoke/contexts/backtest/fixtures/backtest_runtime_acceleration_benchmark_corpus_v1.json
          install -m 0644 .python-version /opt/roehub/app/.python-version
          install -m 0644 alembic.ini /opt/roehub/app/alembic.ini
          install -m 0644 pyproject.toml /opt/roehub/app/pyproject.toml
          install -m 0644 uv.lock /opt/roehub/app/uv.lock
          test -s /opt/roehub/app/alembic.ini
          test -s /opt/roehub/app/pyproject.toml
          test -s /opt/roehub/app/uv.lock
          test -s /opt/roehub/app/tests/perf_smoke/contexts/backtest/fixtures/backtest_runtime_acceleration_benchmark_corpus_v1.json

      - name: Build/update Python runtime
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          uv python install 3.12
          uv sync --locked
          uv run python -V

      - name: Install native production service surface
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          bash scripts/macos/bootstrap_native_prod.sh

      - name: Run DB bootstrap and migrations
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          set -a
          source /Users/daniildegtyarev/.config/roehub/roehub.env
          set +a
          identity_dsn="${IDENTITY_PG_DSN:-host=127.0.0.1 port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}}"
          postgres_dsn="${POSTGRES_DSN:-host=127.0.0.1 port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}}"
          /opt/roehub/app/.venv/bin/python -m apps.migrations.bootstrap_main --identity-dsn "$identity_dsn" --postgres-dsn "$postgres_dsn"

      - name: Detect monitoring config changes
        id: changes
        run: |
          set -euo pipefail
          changed_files=''
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          monitoring_changed=0
          if printf '%s\n' "$changed_files" | grep -Eq '^(infra/macos/prometheus/|infra/macos/blackbox/|infra/macos/launchd/com\.roehub\.blackbox-exporter\.plist)'; then
            monitoring_changed=1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            monitoring_changed=1
          fi
          echo "monitoring_changed=${monitoring_changed}" >> "$GITHUB_OUTPUT"

      - name: Reload production launchd surface
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          bash scripts/macos/reload_launchd_services.sh prod

      - name: Reload monitoring host services
        if: steps.changes.outputs.monitoring_changed == '1'
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          brew services restart prometheus
          brew services restart grafana
          sleep 5

      - name: Service-level smoke backtest-job-runner fleet when jobs.enabled
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          base_metrics_port=9204
          worker_runtime=()
          while IFS= read -r runtime_value; do
            worker_runtime+=("${runtime_value}")
          done < <(
            /opt/roehub/app/.venv/bin/python -c "from trading.contexts.backtest.adapters.outbound import load_backtest_runtime_config; config = load_backtest_runtime_config('/opt/roehub/app/configs/prod/backtest.yaml'); print('1' if config.jobs.enabled else '0'); print(config.jobs.worker_processes)"
          )
          jobs_enabled="${worker_runtime[0]}"
          worker_processes="${worker_runtime[1]}"
          echo "service-level smoke target=backtest-job-runner"
          echo "jobs.enabled=${jobs_enabled}"
          echo "worker_processes=${worker_processes}"
          echo "metrics_endpoint_base_port=${base_metrics_port}"
          echo "no synthetic production job"
          if [ "${jobs_enabled}" != '1' ]; then
            echo "backtest-job-runner fleet is not required because jobs.enabled=false"
            exit 0
          fi
          uid="$(id -u)"
          launchctl list \
            | awk '$3 ~ /^com\.roehub\.backtest-job-runner\.[0-9]+$/ {print}' \
            | tee /tmp/backtest-job-runner-launchctl-list.txt
          registered_workers="$(
            launchctl list \
              | awk '$3 ~ /^com\.roehub\.backtest-job-runner\.[0-9]+$/ {count++} END {print count+0}'
          )"
          live_workers="$(
            launchctl list \
              | awk '$3 ~ /^com\.roehub\.backtest-job-runner\.[0-9]+$/ && $1 ~ /^[0-9]+$/ {count++} END {print count+0}'
          )"
          echo "registered_backtest_job_runner_workers=${registered_workers}"
          echo "live_backtest_job_runner_workers=${live_workers}"
          if [ "${registered_workers}" != "${worker_processes}" ]; then
            echo "service-level smoke failed: expected ${worker_processes} registered backtest-job-runner services after reload"
            exit 1
          fi
          if [ "${live_workers}" != "${worker_processes}" ]; then
            echo "service-level smoke failed: expected ${worker_processes} live backtest-job-runner processes after reload"
            exit 1
          fi
          for ((instance_index = 0; instance_index < worker_processes; instance_index++)); do
            service_label="com.roehub.backtest-job-runner.${instance_index}"
            metrics_port="$((base_metrics_port + instance_index))"
            status_file="/tmp/${service_label}.status.txt"
            metrics_file="/tmp/${service_label}.metrics.txt"
            echo "service-level smoke instance=${instance_index} label=${service_label} metrics_endpoint=http://127.0.0.1:${metrics_port}/metrics"
            launchctl print "gui/${uid}/${service_label}" >"${status_file}"
            grep -E 'state =|pid =|last exit code =' "${status_file}" || true
            if grep -Eq 'last exit code = [1-9][0-9]*' "${status_file}"; then
              echo "service-level smoke failed: ${service_label} reported a non-zero launchd last exit code"
              exit 1
            fi
            metrics_ok='0'
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "http://127.0.0.1:${metrics_port}/metrics" >"${metrics_file}" \
                && grep -q '^# HELP backtest_job_runner_claim_total ' "${metrics_file}"; then
                metrics_ok='1'
                break
              fi
              sleep 5
            done
            if [ "${metrics_ok}" != '1' ]; then
              echo "service-level smoke failed: metrics endpoint for ${service_label} is not live or missing backtest-job-runner counters"
              exit 1
            fi
          done

      - name: Smoke test backend API
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          status_code=''
          for attempt in 1 2 3 4 5 6; do
            status_code="$(curl -sS -o /tmp/backend-current-user.json -w '%{http_code}' http://127.0.0.1:8000/auth/current-user || true)"
            if [ "${status_code}" = '401' ]; then
              break
            fi
            sleep 5
          done
          test "${status_code}" = '401'
          for metrics_port in 9201 9202; do
            ok='0'
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "http://127.0.0.1:${metrics_port}/metrics" >/tmp/backend-metrics-${metrics_port}.txt; then
                ok='1'
                break
              fi
              sleep 5
            done
            test "${ok}" = '1'
          done
          tailscale serve status
