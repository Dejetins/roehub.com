name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:
    inputs:
      exchange_connection_cleanup_mode:
        description: "Optional Stage 09D exchange connection cleanup mode"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "dry-run"
          - "execute"
      exchange_connection_cleanup_repair_audit:
        description: "Repair missing archive audit events for already archived eligible cleanup rows"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect backend deploy changes
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m tools.ci.route_changes backend-deploy --changed-files /dev/null --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          else
            git ls-tree -r --name-only HEAD > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/  /' changed-files.txt
          python -m tools.ci.route_changes backend-deploy --changed-files changed-files.txt >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      needs.changes.outputs.backend_changed == 'true')
    runs-on: [self-hosted, macOS, ARM64, roehub, prod, mac-studio]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Show context
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          whoami
          id
          sw_vers
          uv --version
          tailscale version

      - name: Assert server prerequisites
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          command -v uv
          test -s /Users/daniildegtyarev/.config/roehub/roehub.env
          test -d /opt/roehub
          test -w /opt/roehub
          install -d /opt/roehub/app
          install -d /opt/roehub/config
          install -d /Users/daniildegtyarev/Library/LaunchAgents

      - name: Validate repo layout for native deploy
        run: |
          set -euxo pipefail
          for required_path in apps src configs alembic alembic.ini migrations tools scripts/backtest scripts/live_execution scripts/macos infra/macos infra/scripts/monit .python-version pyproject.toml uv.lock; do
            test -e "${required_path}"
          done

      - name: Sync backend source bundle
        run: |
          set -euxo pipefail
          install -d /opt/roehub/app
          if command -v rsync >/dev/null 2>&1; then
            rsync_flags=( -a --delete --exclude '__pycache__/' --exclude '*.py[cod]' )
            rsync "${rsync_flags[@]}" apps/ /opt/roehub/app/apps/
            rsync "${rsync_flags[@]}" src/ /opt/roehub/app/src/
            rsync "${rsync_flags[@]}" configs/ /opt/roehub/app/configs/
            rsync "${rsync_flags[@]}" alembic/ /opt/roehub/app/alembic/
            rsync "${rsync_flags[@]}" migrations/ /opt/roehub/app/migrations/
            rsync "${rsync_flags[@]}" tools/ /opt/roehub/app/tools/
            rsync "${rsync_flags[@]}" scripts/backtest/ /opt/roehub/app/scripts/backtest/
            rsync "${rsync_flags[@]}" scripts/live_execution/ /opt/roehub/app/scripts/live_execution/
            rsync "${rsync_flags[@]}" scripts/macos/ /opt/roehub/app/scripts/macos/
            rsync "${rsync_flags[@]}" infra/macos/ /opt/roehub/app/infra/macos/
            rsync "${rsync_flags[@]}" infra/scripts/ /opt/roehub/app/infra/scripts/
          else
            rm -rf /opt/roehub/app/apps /opt/roehub/app/src /opt/roehub/app/configs /opt/roehub/app/alembic /opt/roehub/app/migrations /opt/roehub/app/tools /opt/roehub/app/scripts/backtest /opt/roehub/app/scripts/live_execution /opt/roehub/app/scripts/macos /opt/roehub/app/infra/macos /opt/roehub/app/infra/scripts
            mkdir -p /opt/roehub/app/scripts /opt/roehub/app/infra
            tar -C . -cf - apps src configs alembic migrations tools scripts/backtest scripts/live_execution scripts/macos infra/macos infra/scripts | tar -C /opt/roehub/app -xf -
          fi
          install -m 0644 .python-version /opt/roehub/app/.python-version
          install -m 0644 alembic.ini /opt/roehub/app/alembic.ini
          install -m 0644 pyproject.toml /opt/roehub/app/pyproject.toml
          install -m 0644 uv.lock /opt/roehub/app/uv.lock
          test -s /opt/roehub/app/alembic.ini
          test -s /opt/roehub/app/pyproject.toml
          test -s /opt/roehub/app/uv.lock

      - name: Build/update Python runtime
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          uv python install 3.12
          uv sync --locked
          uv run python -V

      - name: Install native production service surface
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          bash scripts/macos/bootstrap_native_prod.sh

      - name: Run DB bootstrap and migrations
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          set -a
          source /Users/daniildegtyarev/.config/roehub/roehub.env
          set +a
          identity_dsn="${IDENTITY_PG_DSN:-host=127.0.0.1 port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}}"
          postgres_dsn="${POSTGRES_DSN:-host=127.0.0.1 port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}}"
          /opt/roehub/app/.venv/bin/python -m apps.migrations.bootstrap_main --identity-dsn "$identity_dsn" --postgres-dsn "$postgres_dsn"

      - name: Detect monitoring config changes
        id: changes
        run: |
          set -euo pipefail
          changed_files=''
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          monitoring_changed=0
          monitoring_pattern='^(infra/macos/prometheus/|infra/macos/blackbox/|infra/macos/launchd/com\.roehub\.blackbox-exporter\.plist|infra/scripts/monit/)'
          if printf '%s\n' "$changed_files" | grep -Eq "$monitoring_pattern"; then
            monitoring_changed=1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            monitoring_changed=1
          fi
          echo "monitoring_changed=${monitoring_changed}" >> "$GITHUB_OUTPUT"

      - name: Reload production launchd surface
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          bash scripts/macos/reload_launchd_services.sh prod

      - name: Reload monitoring host services
        if: steps.changes.outputs.monitoring_changed == '1'
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          brew services restart monit
          brew services restart prometheus
          brew services restart grafana
          sleep 5

      - name: Smoke test backend API
        run: |
          set -euxo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          status_code=''
          for attempt in 1 2 3 4 5 6; do
            status_code="$(curl -sS -o /tmp/backend-current-user.json -w '%{http_code}' http://127.0.0.1:8000/auth/current-user || true)"
            if [ "${status_code}" = '401' ]; then
              break
            fi
            sleep 5
          done
          test "${status_code}" = '401'
          for metrics_port in 9201 9202 9204 9207; do
            ok='0'
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "http://127.0.0.1:${metrics_port}/metrics" >/tmp/backend-metrics-${metrics_port}.txt; then
                ok='1'
                break
              fi
              sleep 5
            done
            test "${ok}" = '1'
          done
          tailscale serve status

      - name: Stage 09D exchange connection cleanup
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.exchange_connection_cleanup_mode != 'none'
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin
          cd /opt/roehub/app
          set -a
          source /Users/daniildegtyarev/.config/roehub/roehub.env
          set +a
          common_args=(
            --limit 100
            --source stage09d
            --exchange-control-url "${ROEHUB_EXCHANGE_CONTROL_INTERNAL_BASE_URL:-http://127.0.0.1:9205}"
          )
          /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
            --dry-run \
            "${common_args[@]}"
          if [ "${{ inputs.exchange_connection_cleanup_mode }}" = "execute" ]; then
            repair_args=()
            if [ "${{ inputs.exchange_connection_cleanup_repair_audit }}" = "true" ]; then
              repair_args=(--repair-archived-audit)
            fi
            /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
              --execute \
              "${common_args[@]}" \
              "${repair_args[@]}"
            /opt/roehub/app/.venv/bin/python -m tools.exchange_connection_cleanup \
              --dry-run \
              "${common_args[@]}"
          fi
