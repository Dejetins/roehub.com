name: Deploy Web

on:
  workflow_run:
    workflows: ["CI", "Publish App Image"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (defaults to main or workflow_run head SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-web-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web_image_changed: ${{ steps.filter.outputs.web_image_changed }}
      web_deploy_config_changed: ${{ steps.filter.outputs.web_deploy_config_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect web deploy changes
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              python -m tools.ci.route_changes web-image --changed-files /dev/null --all
              python -m tools.ci.route_changes web-deploy-config --changed-files /dev/null --all
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          else
            git ls-tree -r --name-only HEAD > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/  /' changed-files.txt
          {
            python -m tools.ci.route_changes web-image --changed-files changed-files.txt
            python -m tools.ci.route_changes web-deploy-config --changed-files changed-files.txt
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Publish App Image' &&
      needs.changes.outputs.web_image_changed == 'true') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'CI' &&
      needs.changes.outputs.web_deploy_config_changed == 'true' &&
      needs.changes.outputs.web_image_changed != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: image
        run: |
          set -euxo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner_lc}/roehub-app"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            image_tag='${{ inputs.image_tag }}'
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Publish App Image" ]; then
            image_tag='${{ github.event.workflow_run.head_sha }}'
          else
            image_tag='main'
          fi
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_repo}:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          test -n "${{ vars.PROD_VPS_ED25519_SHA256 }}"
          ssh-keyscan -t ed25519 "${{ vars.PROD_VPS_HOST }}" > /tmp/prod_vps_known_hosts
          actual_fingerprint="$(ssh-keygen -lf /tmp/prod_vps_known_hosts | awk '{print $2}')"
          test "${actual_fingerprint}" = "${{ vars.PROD_VPS_ED25519_SHA256 }}"
          cat /tmp/prod_vps_known_hosts >> ~/.ssh/known_hosts

      - name: Inspect current VPS Caddy API headers
        run: |
          set -euxo pipefail
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" \
            "awk '/handle_path \\/api\\/\\*/{flag=1} flag{print} flag && /^\\t}/{exit}' /etc/caddy/Caddyfile"

      - name: Sync web deploy files to VPS
        run: |
          set -euxo pipefail
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "install -d /opt/roehub-web"
          scp infra/docker/docker-compose.web.prod.yml "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}:/opt/roehub-web/docker-compose.web.yml"
          scp infra/caddy/Caddyfile.vps "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}:/etc/caddy/Caddyfile"

      - name: Validate API forwarded headers in Caddy config
        run: |
          set -euxo pipefail
          grep -Fq 'header_up X-Forwarded-Host {host}' infra/caddy/Caddyfile.vps
          grep -Fq 'header_up X-Forwarded-Proto {scheme}' infra/caddy/Caddyfile.vps
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" \
            "grep -Fq 'header_up X-Forwarded-Host {host}' /etc/caddy/Caddyfile"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" \
            "grep -Fq 'header_up X-Forwarded-Proto {scheme}' /etc/caddy/Caddyfile"

      - name: Render web env file
        run: |
          set -euxo pipefail
          cat > /tmp/roehub-web.env <<EOF
          ROEHUB_APP_IMAGE=${{ steps.image.outputs.image_ref }}
          WEB_API_BASE_URL=https://roehub.com
          WEB_API_UPSTREAM_URL=https://macstudio-daniil.tail0ebbbc.ts.net
          WEB_HOST_PORT=8010
          EOF

      - name: Deploy web on VPS
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          scp /tmp/roehub-web.env "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}:/opt/roehub-web/roehub-web.env"
          printf '%s' "${GH_TOKEN}" | ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker login ghcr.io -u '${GH_ACTOR}' --password-stdin"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker compose -f /opt/roehub-web/docker-compose.web.yml --env-file /opt/roehub-web/roehub-web.env pull web"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker compose -f /opt/roehub-web/docker-compose.web.yml --env-file /opt/roehub-web/roehub-web.env up -d"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker compose -f /opt/roehub-web/docker-compose.web.yml --env-file /opt/roehub-web/roehub-web.env ps"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "curl -fsS http://127.0.0.1:8010/ >/dev/null"

      - name: Validate and reload Caddy on VPS
        run: |
          set -euxo pipefail
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "caddy fmt --overwrite /etc/caddy/Caddyfile"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "caddy validate --config /etc/caddy/Caddyfile"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "systemctl reload caddy"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "systemctl status caddy --no-pager -l"

      - name: Smoke test public edge
        run: |
          set -euxo pipefail
          test "$(curl -sS -o /tmp/web-root.html -w '%{http_code}' https://roehub.com/)" = '200'
          test "$(curl -sS -o /tmp/web-api.json -w '%{http_code}' https://roehub.com/api/auth/current-user)" = '401'
          test "$(curl -sS -o /tmp/web-www.headers -w '%{http_code}' -I https://www.roehub.com/)" = '301'

      - name: Prune old Docker images on VPS
        run: |
          set -euxo pipefail
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker image prune -af"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker builder prune -af"
          ssh "${{ vars.PROD_VPS_USER }}@${{ vars.PROD_VPS_HOST }}" "docker system df"
