apiVersion: ops.roehub.io/v1
kind: RunbookLocale
metadata:
  runbook_id: runtime.observability-unavailable
  locale: ru
translations:
  title: Независимый сервис операционного здоровья недоступен
  summary: Восстановите сгенерированную границу здоровья и не считайте отсутствие телеметрии здоровым состоянием.
  prerequisites:
    preserve_storage: Сохраните постоянные тома метрик, оповещений, панелей и журналов.
    confirm_independence: Подтвердите, что состояние веб-интерфейса и прикладного интерфейса не используется как сигнал доступности мониторинга.
  symptoms:
    health_scrape_down: Система метрик не может опросить независимый сервис операционного здоровья.
    state_unknown: Административное представление показывает неизвестное состояние из-за отсутствия свежих ограниченных доказательств.
  diagnostics:
    inspect_monitoring:
      instruction: Проверьте сгенерированные контейнеры мониторинга и подключения их постоянных томов.
      expected_evidence: Очищенное состояние контейнеров и наличие томов без значений среды и секретов.
    inspect_scrape:
      instruction: Запросите ограниченное состояние цели и правила операционного здоровья в системе метрик.
      expected_evidence: Состояние цели, правила и оповещения только со сгенерированными метками низкой кардинальности.
  allowed_actions:
    diagnostics: Сохраняйте границу только для чтения, пока не классифицированы свежесть снимка, состояние рабочего процесса, доставка журналов и постоянное хранилище.
    restart_service: Перезапустите только сервис операционного здоровья после проверки сгенерированного манифеста и подключений.
  rollback:
    reconcile_restart:
      instruction: Сверьте тот же перезапуск и сохраните тома мониторинга, если восстановление не удалось.
      expected_evidence: Терминальное состояние операции, свежий снимок здоровья и погашенное оповещение.
  evidence_collect:
    monitoring_state: Очищенное состояние контейнеров, целей, правил и постоянных томов мониторинга.
    recovery_timeline: Время срабатывания и погашения оповещения, а также время восстановленного снимка.
  success_conditions:
    independent_health_ready: Операционное здоровье опрашивается и остаётся доступным при остановке веб-интерфейса или прикладного интерфейса.
  failure_conditions:
    telemetry_missing: Метрики, оповещения или ограниченные переходы состояния отсутствуют после разрешённого действия.
  redaction_rules:
    no_datasource_secrets: Не сохраняйте учётные данные панелей, секреты источников, файлы сеанса и заголовки авторизации.
    no_raw_logs: Сохраняйте только ограниченные операционные переходы, но не произвольные записи приложений.
  monitoring_gaps: {}
  warnings:
    no_volume_removal: Не удаляйте тома мониторинга как способ восстановления.
    no_anonymous_access: Не включайте анонимный доступ к панелям и не публикуйте порты мониторинга.
  stop_conditions:
    manifest_invalid: Остановитесь, если сгенерированный манифест, правило оповещения или ссылка на инструкцию не проходят проверку.
    storage_state_unknown: Остановитесь перед разрушительным действием, если состояние хранилища мониторинга неизвестно.
