apiVersion: ops.roehub.io/v1
kind: RunbookLocale
metadata:
  runbook_id: database.clickhouse-degraded
  locale: ru
translations:
  title: ClickHouse недоступен или потерял расчётную ёмкость
  summary: Безопасно отличить сетевую недоступность, давление памяти и перегрузку запросами до изменения состояния сервиса.
  prerequisites:
    identify_installation: Подтвердите установку и среду, из которой пришёл сигнал.
    preserve_writes: Определите активные процессы записи до любого прерывающего действия.
  symptoms:
    health_probe_failed: HTTP-проверка здоровья ClickHouse завершается ошибкой.
    exporter_degraded: Экспортёр не может выполнить ограниченный запрос метрик.
  diagnostics:
    read_health:
      instruction: Прочитайте состояние здоровья и готовности ClickHouse без изменения состояния.
      expected_evidence: Результат с отметкой времени, идентификатором установки и классификацией «здоров» или «не здоров».
    inspect_metrics:
      instruction: Сопоставьте память, активные и отклонённые запросы и давление на диск.
      expected_evidence: Ограниченный снимок метрик без текста запросов и учётных данных.
  allowed_actions:
    diagnostics: Сохраняйте границу только для чтения, пока не определены целостность хранения, состояние процессов записи и доступная ёмкость.
    pause_writers: Приостановите процессы записи, если новые записи увеличивают риск повреждения или перегрузки.
    resume_writers: Возобновите запись только после стабилизации здоровья и ограниченной проверки записи.
    rollback_release: Откатите текущий выпуск, если деградация доказанно связана с его изменением.
  rollback:
    resume_after_stability:
      instruction: Верните приостановленные процессы записи после подтверждения стабильного здоровья и ёмкости.
      expected_evidence: Процессы записи готовы, а частота ошибок остаётся в пределах политики.
  evidence_collect:
    health_snapshot: Состояние здоровья ClickHouse и готовности экспортёра с отметкой времени.
    pressure_snapshot: Обезличенные метрики памяти, диска, запросов и процессов записи.
  success_conditions:
    stable_queries: Проверка здоровья успешна, а ограниченные чтение и запись стабильны в течение окна наблюдения.
  failure_conditions:
    continued_degradation: Здоровье, диск или память остаются в небезопасном состоянии после разрешённого действия.
  redaction_rules:
    redact_connection: Заменяйте учётные данные подключения и сведения о пользователе маркером удаления.
    omit_query_values: Сохраняйте класс и длительность запроса, но не значения и не пользовательский текст запроса.
  monitoring_gaps: {}
  warnings:
    no_unbounded_queries: Не выполняйте неограниченные диагностические запросы на деградировавшей базе.
    no_restart_loop: Не повторяйте перезапуски без новых доказательств и эскалации владельцу.
  stop_conditions:
    unknown_data_state: Остановитесь, если целостность данных или состояние репликации неизвестны.
