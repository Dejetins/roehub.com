apiVersion: ops.roehub.io/v1
kind: RunbookLocale
metadata:
  runbook_id: worker.market-data-live-tail-gap
  locale: ru
translations:
  title: Оперативный хвост рыночных данных остаётся неполным
  summary: Ограничить пропущенный интервал и приостановить зависимую работу до восстановления.
  prerequisites:
    identify_market: Подтвердите установку, источник, рынок, инструмент и интервал без данных частного счёта.
    preserve_checkpoint: Сохраните последнюю подтверждённую контрольную точку до изменения состояния worker.
  symptoms:
    unrepaired_gap: Закрытый интервал остаётся пропущенным после окна политики восстановления.
    repair_circuit_open: Контур восстановления ClickHouse остаётся разомкнутым или растут ошибки REST-резерва.
  diagnostics:
    inspect_freshness:
      instruction: Сопоставьте задержку хвоста, промахи кэша, попытки восстановления и продвижение подтверждений.
      expected_evidence: Ограниченный снимок свежести по источнику с очищенными метками.
    read_worker_logs:
      instruction: Прочитайте ограниченные события worker вокруг первого пропущенного интервала.
      expected_evidence: Очищенные классы событий и отметки времени без payload и учётных данных.
  allowed_actions:
    pause_worker: Приостановите worker, если дальнейшие подтверждения скроют пропуск.
    restart_worker: Перезапустите worker после сохранения контрольной точки и ограниченных доказательств.
    resume_worker: Возобновите worker только после восстановления или явного карантина пропуска.
  rollback:
    resume_preserved_checkpoint:
      instruction: Возобновите работу от сохранённой точки после проверки отсутствия пропущенных интервалов.
      expected_evidence: Непрерывность контрольных точек и метрики свежести соответствуют политике.
  evidence_collect:
    lag_window: Первый пропущенный, последний подтверждённый и текущий закрытый интервалы.
    repair_outcomes: Очищенные результаты источников восстановления и состояние контура.
  success_conditions:
    continuity_restored: Последовательность закрытых интервалов непрерывна, подтверждения продвигаются штатно.
  failure_conditions:
    gap_persists: Пропуск сохраняется или восстановление требует данных с неизвестной идентичностью.
  redaction_rules:
    redact_source_credentials: Никогда не записывайте учётные данные провайдера или подписанный материал запроса.
    bound_market_payloads: Сохраняйте идентичности интервалов и количества, но не необработанный payload провайдера.
  monitoring_gaps: {}
  warnings:
    no_blind_ack: Не продвигайте подтверждения через пропущенный закрытый интервал.
    no_unbounded_backfill: Не запускайте из этой инструкции неограниченную историческую дозагрузку.
  stop_conditions:
    source_identity_unknown: Остановитесь при неоднозначности источника, рынка, инструмента или контрольной точки.
