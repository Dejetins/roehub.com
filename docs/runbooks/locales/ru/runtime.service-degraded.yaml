apiVersion: ops.roehub.io/v1
kind: RunbookLocale
metadata:
  runbook_id: runtime.service-degraded
  locale: ru
translations:
  title: Сгенерированный сервис среды исполнения работает с деградацией или остановлен
  summary: Локализуйте отказ и восстанавливайте только затронутый сервис через типизированную границу управления.
  prerequisites:
    identify_service: Подтвердите профиль, ограниченный идентификатор сервиса и наблюдаемое состояние.
    preserve_evidence: Сохраните очищенные переходы состояния и исходный идентификатор операции до изменения.
  symptoms:
    readiness_failed: Сгенерированная проверка готовности или метрик не подтверждает готовность.
    service_stopped: Конечная точка сервиса отклоняет соединение, а независимый мониторинг доступен.
  diagnostics:
    inspect_health:
      instruction: Сопоставьте сгенерированное состояние сервиса с прямой синтетической проверкой.
      expected_evidence: Состояние с отметкой времени и ограниченным кодом детали без адресов и идентификационных данных.
    inspect_metrics:
      instruction: Проверьте ограниченные сигналы готовности и ошибок сервиса и объявленных зависимостей.
      expected_evidence: Метрики с низкой кардинальностью без меток организации, счёта или секрета.
  allowed_actions:
    diagnostics: Сохраняйте границу только для чтения, пока не определены затронутый сервис и состояние зависимостей.
    restart_service: Перезапустите только выявленный сервис после определения границы отказа и состояния зависимостей.
  rollback:
    reconcile_restart:
      instruction: Сверьте результат перезапуска и прекратите повторы, если эффект остаётся неизвестным.
      expected_evidence: Терминальное состояние операции и устойчивый переход готовности того же сервиса.
  evidence_collect:
    state_transition: Очищенные переходы готов, деградация, остановлен или неизвестно с отметками времени.
    dependency_state: Ограниченное состояние объявленных зависимостей и независимых сервисов мониторинга.
  success_conditions:
    service_stable: Сервис вернулся в готовность и стабилен, а мониторинг и журналы доступны для запросов.
  failure_conditions:
    boundary_unknown: Граница отказа, состояние зависимости или эффект перезапуска остаются неизвестными.
  redaction_rules:
    bounded_labels_only: Сохраняйте только сгенерированные метки сервиса, возможности, состояния, инструкции, действия и профиля.
    no_raw_payloads: Не сохраняйте тела ответов, значения среды, ответы провайдеров и идентификаторы пользователей.
  monitoring_gaps: {}
  warnings:
    no_broad_restart: Не перезапускайте посторонние сервисы или все зависимости как способ диагностики.
    no_blind_retry: Не повторяйте перезапуск, пока эффект исходной операции неизвестен.
  stop_conditions:
    data_integrity_unknown: Остановитесь, если целостность хранилища, состояние миграции или внешний эффект неизвестны.
    action_not_allowlisted: Остановитесь, если необходимое действие отсутствует в сгенерированном списке разрешений.
