apiVersion: ops.roehub.io/v1
kind: RunbookLocale
metadata:
  runbook_id: auth.openbao-unavailable
  locale: ru
translations:
  title: Разрешение ссылок OpenBao или операции Transit недоступны
  summary: Сохранить безопасный отказ и отличить неинициализированное состояние, seal, сеть и отказ политики.
  prerequisites:
    confirm_fail_closed: Подтвердите, что операции с секретами заблокированы и не переходят к plaintext-резерву.
    identify_scope: Подтвердите установку и служебную идентичность без чтения значений секретов.
  symptoms:
    transit_unavailable: Шифрование, расшифрование или HMAC возвращает очищенный результат недоступности.
    reference_unavailable: Типизированная ссылка KV v2 не разрешается внутри доверенной границы сервиса.
    service_not_ready: Готовность exchange-control сообщает о недоступности хранилища секретов.
  diagnostics:
    read_health:
      instruction: Прочитайте seal и health OpenBao через разрешённую границу здоровья.
      expected_evidence: Код состояния и классификация uninitialized, sealed, unsealed или unavailable без credentials.
    read_audit:
      instruction: Проверьте ограниченные классы решений авторизации для затронутой служебной идентичности.
      expected_evidence: Очищенные allow или deny и идентификаторы запроса без policy tokens.
  allowed_actions:
    diagnostics: Сохраняйте границу только для чтения, пока не классифицированы инициализация, запечатывание, политика и доступность сети.
    rollback_release: Откатите выпуск, если отказ вызван проверенным изменением политики или wiring.
  rollback:
    rollback_verified_change:
      instruction: Восстановите последний проверенный выпуск без экспорта или копирования секретного материала.
      expected_evidence: Health и один ограниченный Transit canary успешны, доказательства очищены.
  evidence_collect:
    seal_health: Очищенные классификации инициализации, seal, готовности и связности.
    policy_outcome: Очищенная служебная идентичность и класс решения авторизации.
  success_conditions:
    bounded_canary: Ограниченный Transit canary успешен, plaintext fallback отсутствует.
  failure_conditions:
    sealed_or_unknown: Сервис остаётся uninitialized, sealed, unauthorized или в неизвестном состоянии.
  redaction_rules:
    no_transit_material: Никогда не сохраняйте plaintext, ciphertext, HMAC-входы, ключи и служебные tokens.
    sanitize_policy: Сохраняйте класс решения политики без необработанного документа и credentials идентичности.
  monitoring_gaps: {}
  warnings:
    no_unseal_material: Не запрашивайте и не вставляйте unseal-материал в чат, логи или доказательства инцидента.
    no_plaintext_fallback: Не обходите Transit-шифрование локальным plaintext-хранилищем.
  stop_conditions:
    authority_missing: Остановитесь перед production unseal, изменением политики, ротацией или force restore без явного разрешения владельца.
