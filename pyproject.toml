[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "roehub"
version = "0.1.0"
description = "roehub.com (open-source repo)"
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "tools/release/THIRD_PARTY_NOTICES.md",
  "apps/web/dist/vendor/lightweight-charts.NOTICE.txt",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  # Base runtime
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "orjson==3.10.12",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.2",
  "numpy==2.0.2",
  "numba==0.60.0",
  # API (FastAPI)
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.0",
  "jinja2==3.1.4",
  "httpx==0.27.2",
  "requests==2.32.5",
  # PostgreSQL
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.4",
  # Redis
  "redis==5.2.0",
  # Metrics
  "prometheus-client==0.21.0",
  # Crypto / validation
  "cryptography==43.0.3",
  "jsonschema==4.23.0",
  "webauthn==2.5.1",
  "argon2-cffi==25.1.0",
]

[project.scripts]
roehubctl = "apps.roehubctl.main.main:main"
roehub-control-agent = "apps.control_agent.main.main:main"

[project.optional-dependencies]
rl-ml = [
  "optuna>=4.2,<5",
  "torch==2.7.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "ruff==0.7.4",
  "mypy==1.13.0",
  "types-python-dateutil==2.9.0.20241003",
  "types-PyYAML==6.0.12.20240917",
  "pyright[nodejs]>=1.1.408",
]
data = [
  "pandas==2.2.3",
  "pyarrow==18.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [
  "apps/web/dist/*.js",
  "apps/web/templates/*.html",
  "tests/notebook_tests/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Preserve the exact source bytes bound by this completed pack's ledger/receipts.
# Existing completed packs retain layout exceptions; PG evidence exceptions below also
# name harmless unused imports/bindings. Other functional lint checks remain enabled.
[tool.ruff.lint.per-file-ignores]
".codex/agents/generated/backtest-npy-input-materialization-v1/ledger_update.py" = ["E501"]
".codex/agents/generated/backtest-npy-input-materialization-v1/test_ledger_update.py" = ["E501", "I001"]

".codex/agents/generated/data-artifact-management-v1/ledger_update.py" = ["E501"]
