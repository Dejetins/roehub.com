# Exact pre-S08 evidence/updater exceptions; bytes are receipt-bound or executor-owned.
# Layout/import ordering and documented unused imports/bindings only; no S08/runtime exemptions.
# See reports/S08/lint-preservation.json for entry hashes and individual diagnostics.
".codex/agents/generated/postgresql-only-storage-v1/ledger_update.py" = ["E501"]
".codex/agents/generated/postgresql-only-storage-v1/reports/S01/audit_sources.py" = ["E501", "E701", "E702", "E741", "I001"]
