openapi: 3.1.0
info:
  title: Roehub Plugin RPC
  version: v1alpha1
  description: Typed network boundary implemented by isolated plugin containers.
servers:
  - url: http://plugin-runtime:8080
paths:
  /v1alpha1/health:
    get:
      operationId: pluginHealth
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
      responses:
        '200': {$ref: '#/components/responses/PluginResponse'}
  /v1alpha1/metrics:
    get:
      operationId: pluginMetrics
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
      responses:
        '200': {$ref: '#/components/responses/PluginResponse'}
  /v1alpha1/data-source/query:
    post:
      operationId: queryDataSource
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
      requestBody: {$ref: '#/components/requestBodies/DataSourceQuery'}
      responses:
        '200': {$ref: '#/components/responses/DataSourceResponse'}
  /v1alpha1/panel/describe:
    post:
      operationId: describePanel
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
      requestBody: {$ref: '#/components/requestBodies/PluginRequest'}
      responses:
        '200': {$ref: '#/components/responses/PluginResponse'}
  /v1alpha1/app/action:
    post:
      operationId: invokeAppAction
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/PluginRequest'}
      responses:
        '200': {$ref: '#/components/responses/PluginResponse'}
  /v1alpha1/notification-provider/send:
    post:
      operationId: sendNotification
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Identity'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/PluginRequest'}
      responses:
        '200': {$ref: '#/components/responses/PluginResponse'}
components:
  parameters:
    Protocol:
      name: X-Roehub-Plugin-Protocol
      in: header
      required: true
      schema: {const: roehub.plugin.rpc/v1alpha1}
    Identity:
      name: Authorization
      in: header
      required: true
      description: Ed25519 signed service identity with a lifetime no longer than 60 seconds.
      schema: {type: string, pattern: '^RoehubPluginIdentity [A-Za-z0-9._-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  requestBodies:
    DataSourceQuery:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DataSourceQuery'}
    PluginRequest:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  responses:
    DataSourceResponse:
      description: Versioned, bounded, and redacted data frame response.
      headers:
        X-Roehub-Plugin-Protocol:
          required: true
          schema: {const: roehub.plugin.rpc/v1alpha1}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [contract, status, frame]
            properties:
              contract: {const: PluginResponse/v1alpha1}
              status: {enum: [succeeded, partial]}
              frame: {$ref: './roehub-data-frame-v1.schema.json'}
    PluginResponse:
      description: Versioned redacted plugin response.
      headers:
        X-Roehub-Plugin-Protocol:
          required: true
          schema: {const: roehub.plugin.rpc/v1alpha1}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [contract]
            properties:
              contract: {const: PluginResponse/v1alpha1}
  schemas:
    PluginCapability:
      type: string
      enum: [app.action, data.read, notification.send, panel.describe]
    DataSourceQuery:
      type: object
      additionalProperties: false
      required: [contract, dataset, dimensions, measures, filters, limits, read_only]
      properties:
        contract: {const: DataSourceQuery/v1}
        dataset: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$'}
        dimensions:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$'}
        measures:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$'}
        filters:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$'}
              operator: {enum: [eq, in, gt, gte, lt, lte]}
              value:
                oneOf:
                  - {type: [string, integer, number, boolean, 'null']}
                  - type: array
                    minItems: 1
                    maxItems: 100
                    items: {type: [string, integer, number, boolean, 'null']}
        limits:
          type: object
          additionalProperties: false
          required: [rows, bytes, points, timeout_ms]
          properties:
            rows: {type: integer, minimum: 1, maximum: 1000}
            bytes: {type: integer, minimum: 1024, maximum: 1048576}
            points: {type: integer, minimum: 1, maximum: 5000}
            timeout_ms: {type: integer, minimum: 50, maximum: 5000}
        read_only: {const: true}
