global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/mac-studio-monitoring.rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - labels:
          service: api_health
        targets: ["http://api:8000/health"]
      - labels:
          service: clickhouse_http_ping
        targets: ["http://clickhouse:8123/ping"]
      - labels:
          service: grafana_health
        targets: ["http://grafana:3000/api/health"]
      - labels:
          service: prometheus_health
        targets: ["http://prometheus:9090/-/healthy"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - labels:
          service: clickhouse_native_tcp
        targets: ["clickhouse:9000"]
      - labels:
          service: postgres_tcp
        targets: ["postgres:5432"]
      - labels:
          service: redis_tcp
        targets: ["redis:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: clickhouse_exporter
    static_configs:
      - targets: ["clickhouse_exporter:9116"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: market-data-ws-worker
    static_configs:
      - targets: ["market-data-ws-worker:9201"]

  - job_name: market-data-scheduler
    static_configs:
      - targets: ["market-data-scheduler:9202"]

  - job_name: backtest-artifact-publisher
    static_configs:
      - targets: ["backtest-artifact-publisher:9203"]

  - job_name: node_exporter
    static_configs:
      - targets: ["host.lima.internal:9100"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis_exporter:9121"]
