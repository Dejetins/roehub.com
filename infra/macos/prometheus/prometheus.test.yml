global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus-test
    static_configs:
      - targets: ["127.0.0.1:19090"]

  - job_name: blackbox-http-test
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:13000/api/health
          - http://127.0.0.1:18124/ping
          - http://127.0.0.1:18000/openapi.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:19115

  - job_name: blackbox-tcp-test
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:15433
          - 127.0.0.1:19001
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:19115

  - job_name: market-data-ws-worker-test
    static_configs:
      - targets: ["127.0.0.1:19201"]

  - job_name: market-data-scheduler-test
    static_configs:
      - targets: ["127.0.0.1:19202"]

  - job_name: backtest-artifact-publisher-test
    static_configs:
      - targets: ["127.0.0.1:19203"]
