global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /opt/roehub/config/prometheus.rules/live-execution-stage17.rules.yml
  - /opt/roehub/config/prometheus.rules/strategy-producer.rules.yml
  - /opt/roehub/config/prometheus.rules/market-data-funding.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["127.0.0.1:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["127.0.0.1:9121"]

  - job_name: clickhouse-exporter
    static_configs:
      - targets: ["127.0.0.1:9116"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3000/api/health
          - http://127.0.0.1:8123/ping
          - http://127.0.0.1:8000/openapi.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:5432
          - 127.0.0.1:9000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: market-data-ws-worker
    static_configs:
      - targets: ["127.0.0.1:9201"]

  - job_name: market-data-scheduler
    static_configs:
      - targets: ["127.0.0.1:9202"]

  - job_name: backtest-artifact-publisher
    static_configs:
      - targets: ["127.0.0.1:9203"]

  - job_name: backtest-job-runner
    static_configs:
      - targets: ["127.0.0.1:9204"]

  - job_name: exchange-control
    static_configs:
      - targets: ["127.0.0.1:9205"]

  - job_name: exchange-execution
    static_configs:
      - targets: ["127.0.0.1:9206"]

  - job_name: strategy-producer
    static_configs:
      - targets: ["127.0.0.1:9207"]

  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["127.0.0.1:8200"]
