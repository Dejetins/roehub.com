services:
  web:
    image: ${ROEHUB_APP_IMAGE:?ROEHUB_APP_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - /opt/roehub-web/roehub-web.env
    command:
      - python
      - -m
      - apps.web.main.main
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8010}:8010"
