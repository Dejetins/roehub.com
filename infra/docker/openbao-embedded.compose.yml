name: roehub-openbao

services:
  openbao:
    image: ghcr.io/dejetins/roehub-openbao:2.5.4-roehub-licensed-qr.1@sha256:8492e2c1a523aac5da44e41c86e84eac992479fb7c4a79c2e1a07b8b24bcec4a
    entrypoint: ["bao"]
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    user: "100:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${ROEHUB_OPENBAO_PORT:-18200}:8200"
    volumes:
      - ../openbao/config/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: unless-stopped
    networks: [openbao-internal]

networks:
  openbao-internal:

volumes:
  openbao-data:
  openbao-audit:
