services:
  web:
    build:
      context: ${MARKET_DATA_BUILD_CONTEXT:-../..}
      dockerfile: ${MARKET_DATA_DOCKERFILE:-infra/docker/Dockerfile.market_data}
    restart: unless-stopped
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL}
    command:
      - python
      - -m
      - apps.web.main.main
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8010}:8010"
