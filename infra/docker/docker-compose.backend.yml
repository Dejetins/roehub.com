x-roehub-app: &roehub-app
  image: ${ROEHUB_APP_IMAGE:?ROEHUB_APP_IMAGE is required}
  pull_policy: always
  env_file:
    - ${ROEHUB_ENV_FILE:-/etc/roehub/roehub.env}

services:
  postgres:
    image: postgres:16
    container_name: roehub-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roehub}
      POSTGRES_USER: ${POSTGRES_USER:-roehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roehub} -d ${POSTGRES_DB:-roehub}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: roehub-clickhouse-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-roehub}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-roe}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  db-bootstrap:
    <<: *roehub-app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      IDENTITY_PG_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-roehub} user=${POSTGRES_USER:-roehub} password=${POSTGRES_PASSWORD}"
      POSTGRES_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-roehub} user=${POSTGRES_USER:-roehub} password=${POSTGRES_PASSWORD}"
    command:
      - python
      - -m
      - apps.migrations.bootstrap_main

  api:
    <<: *roehub-app
    depends_on:
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      ROEHUB_ENV: ${ROEHUB_ENV:-dev}
      ROEHUB_NUMBA_NUM_THREADS: ${ROEHUB_NUMBA_NUM_THREADS:-4}
      NUMBA_NUM_THREADS: ${ROEHUB_NUMBA_NUM_THREADS:-4}
      IDENTITY_FAIL_FAST: ${IDENTITY_FAIL_FAST:-false}
      STRATEGY_FAIL_FAST: ${STRATEGY_FAIL_FAST:-false}
      BACKTEST_FAIL_FAST: ${BACKTEST_FAIL_FAST:-false}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-roehub}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-roehub-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-keycloak-client-secret}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://127.0.0.1:8010/auth/callback}
      KEYCLOAK_LOGOUT_REDIRECT_URI: ${KEYCLOAK_LOGOUT_REDIRECT_URI:-http://127.0.0.1:8010/login}
      KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL:-}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-}
      KEYCLOAK_END_SESSION_URL: ${KEYCLOAK_END_SESSION_URL:-}
      KEYCLOAK_INTROSPECTION_URL: ${KEYCLOAK_INTROSPECTION_URL:-}
      IDENTITY_SESSION_COOKIE_NAME: ${IDENTITY_SESSION_COOKIE_NAME:-roehub_session_id}
      IDENTITY_SESSION_IDLE_TTL_SECONDS: ${IDENTITY_SESSION_IDLE_TTL_SECONDS:-1800}
      IDENTITY_SESSION_ABSOLUTE_TTL_SECONDS: ${IDENTITY_SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      IDENTITY_PG_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-roehub} user=${POSTGRES_USER:-roehub} password=${POSTGRES_PASSWORD}"
      STRATEGY_PG_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-roehub} user=${POSTGRES_USER:-roehub} password=${POSTGRES_PASSWORD}"
      CH_HOST: ${CH_HOST:-clickhouse}
      CH_PORT: ${CH_PORT:-8123}
      CH_DATABASE: ${CH_DATABASE:-market_data}
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_SECURE: ${CH_SECURE:-0}
      CH_VERIFY: ${CH_VERIFY:-1}
      ROEHUB_REDIS_PASSWORD: ${ROEHUB_REDIS_PASSWORD:-}
    command:
      - python
      - -m
      - apps.api.main.main
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    expose:
      - "8000"

  market-data-ws-worker:
    <<: *roehub-app
    restart: unless-stopped
    depends_on:
      - clickhouse
      - redis
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_DATABASE: ${CH_DATABASE:-market_data}
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_SECURE: "0"
      CH_VERIFY: "1"
      ROEHUB_REDIS_PASSWORD: ${ROEHUB_REDIS_PASSWORD:-}
    command:
      - python
      - -m
      - apps.worker.market_data_ws.main.main
      - --config
      - /app/configs/prod/market_data.yaml
      - --metrics-port
      - "9201"
    expose:
      - "9201"

  market-data-scheduler:
    <<: *roehub-app
    restart: unless-stopped
    depends_on:
      - clickhouse
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_DATABASE: ${CH_DATABASE:-market_data}
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_SECURE: "0"
      CH_VERIFY: "1"
    command:
      - python
      - -m
      - apps.scheduler.market_data_scheduler.main.main
      - --config
      - /app/configs/prod/market_data.yaml
      - --whitelist
      - /app/configs/prod/whitelist.csv
      - --metrics-port
      - "9202"
    expose:
      - "9202"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.56.2
    container_name: cadvisor
    privileged: true
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /dev/disk:/dev/disk:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run:/var/run:ro

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    container_name: postgres_exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-roehub}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-roehub}
    expose:
      - "9187"

  redis_exporter:
    image: oliver006/redis_exporter:v1.80.1
    container_name: redis_exporter
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${ROEHUB_REDIS_PASSWORD:-}
    expose:
      - "9121"

  clickhouse_exporter:
    <<: *roehub-app
    container_name: clickhouse_exporter
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_started
    environment:
      CH_DATABASE: ${CH_DATABASE:-market_data}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CH_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_EXPORTER_HOST: 0.0.0.0
      CLICKHOUSE_EXPORTER_PORT: "9116"
      CLICKHOUSE_EXPORTER_SCRAPE_URI: http://clickhouse:8123/
      CLICKHOUSE_EXPORTER_TIMEOUT_SECONDS: "5.0"
      CLICKHOUSE_EXPORTER_VERIFY_TLS: "0"
    command:
      - python
      - -m
      - apps.monitoring.clickhouse_exporter
    expose:
      - "9116"

volumes:
  pg_data:
    external: true
    name: roehub_pg_data
  ch_data:
    external: true
    name: roehub_ch_data
  ch_logs:
    external: true
    name: roehub_ch_logs
  redis_data:
    external: true
    name: roehub_redis_data
  prom_data:
    external: true
    name: roehub_prom_data
  grafana_data:
    external: true
    name: grafana_data
