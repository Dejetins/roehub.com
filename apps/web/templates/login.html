{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>Login</h1>
    <p>Continue to Keycloak login to access protected Roehub pages.</p>
    <p>
      <a id="keycloak-login-link" href="{{ oidc_login_url }}">Continue with Keycloak</a>
    </p>
    <p>If automatic redirect does not start, use the link above.</p>

    <script>
      const oidcLoginUrl = {{ oidc_login_url | tojson }};
      window.location.assign(oidcLoginUrl);
    </script>
  </section>
{% endblock %}
