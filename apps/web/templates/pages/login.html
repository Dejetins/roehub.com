{% extends "base.html" %}

{% block content %}
  <section class="rh-auth-page" aria-labelledby="login-title">
    <div class="rh-kicker">Keycloak</div>
    <h1 id="login-title">Вход в Roehub</h1>
    <p>Сессия Roehub создается после OIDC-перехода через Keycloak.</p>
    <div class="rh-command-row">
      <a id="keycloak-login-link" class="rh-button rh-button--primary" href="{{ oidc_login_url }}">
        Продолжить вход
      </a>
      <a class="rh-button" href="/register">Регистрация</a>
    </div>
  </section>
{% endblock %}
