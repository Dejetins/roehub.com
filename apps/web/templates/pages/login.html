{% extends "base.html" %}

{% block content %}
  <section class="rh-auth-page" aria-labelledby="login-title">
    <div class="rh-kicker">{{ t("login.kicker") }}</div>
    <h1 id="login-title">{{ t("login.title") }}</h1>
    <p>{{ t("login.description") }}</p>
    <div class="rh-command-row">
      <a id="keycloak-login-link" class="rh-button rh-button--primary" href="{{ oidc_login_url }}">
        {{ t("login.continue") }}
      </a>
      <a class="rh-button" href="/register">{{ t("auth.register") }}</a>
    </div>
  </section>
{% endblock %}
