{% extends "base.html" %}

{% block page_assets %}
    <link rel="stylesheet" href="{{ asset_url('/assets/css/pages/landing.css') }}">
{% endblock %}

{% block content %}
  <div class="landing-page" data-page="landing" data-landing-root>
    <section class="landing-hero" aria-labelledby="landing-title">
      <div class="landing-hero__copy">
        <h1 id="landing-title">{{ t("landing.title") }}</h1>
        <p class="landing-hero__body">{{ t("landing.body") }}</p>
        <div class="landing-hero__actions">
          <button class="shell-button shell-button--primary" type="button" data-auth-open>
            {{ t("landing.primary_cta") }}
          </button>
          <a class="shell-button shell-button--ghost" href="/register">
            {{ t("landing.secondary_cta") }}
          </a>
        </div>
      </div>
    </section>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script type="module" src="{{ asset_url('/assets/js/pages/landing.js') }}"></script>
{% endblock %}
