<section class="rh-settings-panel rh-settings-panel--wide" aria-labelledby="settings-exchange-title">
  <div class="rh-settings-panel__header">
    <h2 id="settings-exchange-title" data-i18n="settings.exchange.title">{{ t("settings.exchange.title") }}</h2>
    <span class="rh-status-badge rh-status-badge--neutral" data-exchange-count>0</span>
  </div>

  <form class="rh-settings-form rh-settings-form--exchange" data-settings-form="exchange-key" autocomplete="off">
    <label>
      <span data-i18n="settings.exchange.exchange">{{ t("settings.exchange.exchange") }}</span>
      <select name="exchange_name">
        <option value="binance">binance</option>
        <option value="bybit">bybit</option>
      </select>
    </label>
    <label>
      <span data-i18n="settings.exchange.market">{{ t("settings.exchange.market") }}</span>
      <select name="market_type">
        <option value="spot">spot</option>
        <option value="futures">futures</option>
      </select>
    </label>
    <label>
      <span data-i18n="settings.exchange.permissions">{{ t("settings.exchange.permissions") }}</span>
      <select name="permissions">
        <option value="read">read</option>
        <option value="trade">trade</option>
      </select>
    </label>
    <label>
      <span data-i18n="settings.exchange.label">{{ t("settings.exchange.label") }}</span>
      <input name="label" maxlength="64" autocomplete="off">
    </label>
    <label>
      <span data-i18n="settings.exchange.api_key">{{ t("settings.exchange.api_key") }}</span>
      <input name="api_key" required autocomplete="off" spellcheck="false">
    </label>
    <label>
      <span data-i18n="settings.exchange.api_secret">{{ t("settings.exchange.api_secret") }}</span>
      <input name="api_secret" required type="password" autocomplete="new-password" spellcheck="false">
    </label>
    <label>
      <span data-i18n="settings.exchange.passphrase">{{ t("settings.exchange.passphrase") }}</span>
      <input name="passphrase" type="password" autocomplete="new-password" spellcheck="false">
    </label>
    <button class="rh-button rh-button--primary" type="submit" data-i18n="settings.action.add_exchange_key">
      {{ t("settings.action.add_exchange_key") }}
    </button>
  </form>

  <div class="rh-table-wrap">
    <table class="rh-data-table rh-settings-table">
      <thead>
        <tr>
          <th data-i18n="settings.exchange.exchange">{{ t("settings.exchange.exchange") }}</th>
          <th data-i18n="settings.exchange.label">{{ t("settings.exchange.label") }}</th>
          <th data-i18n="settings.exchange.permissions">{{ t("settings.exchange.permissions") }}</th>
          <th data-i18n="settings.exchange.masked_key">{{ t("settings.exchange.masked_key") }}</th>
          <th data-i18n="settings.table.updated">{{ t("settings.table.updated") }}</th>
          <th data-i18n="settings.table.actions">{{ t("settings.table.actions") }}</th>
        </tr>
      </thead>
      <tbody data-exchange-keys-list>
        <tr>
          <td colspan="6" data-i18n="settings.loading">{{ t("settings.loading") }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
