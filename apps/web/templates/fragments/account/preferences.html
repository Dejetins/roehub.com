<section class="rh-settings-panel" aria-labelledby="settings-preferences-title">
  <div class="rh-settings-panel__header">
    <h2 id="settings-preferences-title" data-i18n="settings.preferences.title">{{ t("settings.preferences.title") }}</h2>
    <span class="rh-status-badge rh-status-badge--neutral" data-preferences-updated>--</span>
  </div>

  <form class="rh-settings-form" data-settings-form="preferences">
    <label>
      <span data-i18n="settings.preferences.theme">{{ t("settings.preferences.theme") }}</span>
      <select name="theme" data-preference-theme>
        <option value="terminal-orange">terminal-orange</option>
        <option value="graphite">graphite</option>
        <option value="matrix-green">matrix-green</option>
        <option value="high-contrast">high-contrast</option>
      </select>
    </label>
    <label>
      <span data-i18n="settings.preferences.locale">{{ t("settings.preferences.locale") }}</span>
      <select name="locale" data-preference-locale>
        <option value="en">en</option>
        <option value="ru">ru</option>
      </select>
    </label>
    <label>
      <span data-i18n="settings.preferences.density">{{ t("settings.preferences.density") }}</span>
      <select name="density">
        <option value="compact">compact</option>
        <option value="comfortable">comfortable</option>
      </select>
    </label>
    <button class="rh-button rh-button--primary" type="submit" data-i18n="settings.action.save_preferences">
      {{ t("settings.action.save_preferences") }}
    </button>
  </form>

  <div class="rh-settings-financial-check" aria-label="{{ t('settings.preferences.financial_aria') }}">
    <span class="rh-financial--positive">+3.84%</span>
    <span class="rh-financial--negative">-1.12%</span>
    <span class="rh-financial--neutral">0.00%</span>
  </div>
</section>
