<form class="rh-backtests-form" data-backtests-run-form>
  <fieldset class="rh-backtests-fieldset">
    <legend data-i18n="backtests.run.scope">{{ t("backtests.run.scope") }}</legend>
    <div class="rh-form-grid">
      <label for="backtest-exchange" data-i18n="backtests.field.exchange">{{ t("backtests.field.exchange") }}</label>
      <input id="backtest-exchange" name="exchange" type="text" value="binance" autocomplete="off">

      <label for="backtest-market-type" data-i18n="backtests.field.market_type">{{ t("backtests.field.market_type") }}</label>
      <select id="backtest-market-type" name="market_type">
        <option value="spot">spot</option>
        <option value="futures">futures</option>
      </select>

      <label for="backtest-symbol" data-i18n="backtests.field.symbol">{{ t("backtests.field.symbol") }}</label>
      <input id="backtest-symbol" name="symbol" type="text" value="BTCUSDT" autocomplete="off" list="backtest-symbol-options">
      <datalist id="backtest-symbol-options"></datalist>

      <label for="backtest-timeframe" data-i18n="backtests.field.timeframe">{{ t("backtests.field.timeframe") }}</label>
      <select id="backtest-timeframe" name="timeframe"></select>

      <label for="backtest-start" data-i18n="backtests.field.start">{{ t("backtests.field.start") }}</label>
      <input id="backtest-start" name="start" type="datetime-local" value="2020-01-11T20:08">

      <label for="backtest-end" data-i18n="backtests.field.end">{{ t("backtests.field.end") }}</label>
      <input id="backtest-end" name="end" type="datetime-local" value="2026-04-11T20:08">

      <label for="backtest-top-n" data-i18n="backtests.field.top_n">{{ t("backtests.field.top_n") }}</label>
      <input id="backtest-top-n" name="top_n" type="number" min="1" max="100" step="1" value="100">
    </div>
  </fieldset>

  <fieldset class="rh-backtests-fieldset">
    <legend data-i18n="backtests.run.indicators">{{ t("backtests.run.indicators") }}</legend>
    <div class="rh-backtests-indicators" data-backtests-indicator-rows></div>
    <button class="rh-button rh-button--ghost" type="button" data-backtests-add-indicator data-i18n="backtests.action.add_indicator">
      {{ t("backtests.action.add_indicator") }}
    </button>
  </fieldset>

  <fieldset class="rh-backtests-fieldset">
    <legend data-i18n="backtests.run.risk">{{ t("backtests.run.risk") }}</legend>
    <div class="rh-form-grid">
      <label for="backtest-risk-mode" data-i18n="backtests.field.risk_mode">{{ t("backtests.field.risk_mode") }}</label>
      <select id="backtest-risk-mode" name="risk_mode"></select>

      <label for="backtest-ranking-metric" data-i18n="backtests.field.ranking_metric">{{ t("backtests.field.ranking_metric") }}</label>
      <select id="backtest-ranking-metric" name="ranking_metric"></select>

      <label for="backtest-ranking-direction" data-i18n="backtests.field.ranking_direction">{{ t("backtests.field.ranking_direction") }}</label>
      <select id="backtest-ranking-direction" name="ranking_direction">
        <option value="desc">desc</option>
        <option value="asc">asc</option>
      </select>
    </div>
    <div class="rh-backtests-tp-sl" data-backtests-tp-sl-grid hidden>
      <div class="rh-form-grid rh-form-grid--compact">
        <label for="backtest-tp-start">TP start %</label>
        <input id="backtest-tp-start" type="number" step="0.5" value="2">
        <label for="backtest-tp-stop">TP stop %</label>
        <input id="backtest-tp-stop" type="number" step="0.5" value="25">
        <label for="backtest-tp-step">TP step %</label>
        <input id="backtest-tp-step" type="number" step="0.5" value="0.5">
        <label for="backtest-sl-start">SL start %</label>
        <input id="backtest-sl-start" type="number" step="0.5" value="2">
        <label for="backtest-sl-stop">SL stop %</label>
        <input id="backtest-sl-stop" type="number" step="0.5" value="25">
        <label for="backtest-sl-step">SL step %</label>
        <input id="backtest-sl-step" type="number" step="0.5" value="0.5">
      </div>
    </div>
  </fieldset>

  <fieldset class="rh-backtests-fieldset">
    <legend data-i18n="backtests.run.execution">{{ t("backtests.run.execution") }}</legend>
    <div class="rh-form-grid">
      <label for="backtest-direction-mode" data-i18n="backtests.field.direction_mode">{{ t("backtests.field.direction_mode") }}</label>
      <select id="backtest-direction-mode" name="direction_mode"></select>

      <label for="backtest-sizing-mode" data-i18n="backtests.field.sizing_mode">{{ t("backtests.field.sizing_mode") }}</label>
      <select id="backtest-sizing-mode" name="sizing_mode"></select>

      <label for="backtest-fee-rate" data-i18n="backtests.field.fee_rate">{{ t("backtests.field.fee_rate") }}</label>
      <input id="backtest-fee-rate" type="number" step="0.00001" value="0.00075">

      <label for="backtest-slippage-rate" data-i18n="backtests.field.slippage_rate">{{ t("backtests.field.slippage_rate") }}</label>
      <input id="backtest-slippage-rate" type="number" step="0.00001" value="0.0001">

      <label for="backtest-initial-cash" data-i18n="backtests.field.initial_cash">{{ t("backtests.field.initial_cash") }}</label>
      <input id="backtest-initial-cash" type="number" min="0" step="100" value="10000">

      <label for="backtest-quote-amount" data-i18n="backtests.field.quote_amount">{{ t("backtests.field.quote_amount") }}</label>
      <input id="backtest-quote-amount" type="number" min="0" step="10" value="1000">

      <label for="backtest-equity-pct" data-i18n="backtests.field.equity_pct">{{ t("backtests.field.equity_pct") }}</label>
      <input id="backtest-equity-pct" type="number" min="0" step="0.1" value="10">

      <label for="backtest-min-quote" data-i18n="backtests.field.min_quote">{{ t("backtests.field.min_quote") }}</label>
      <input id="backtest-min-quote" type="number" min="0" step="10" value="100">

      <label for="backtest-max-quote" data-i18n="backtests.field.max_quote">{{ t("backtests.field.max_quote") }}</label>
      <input id="backtest-max-quote" type="number" min="0" step="10" value="2500">
    </div>
    <div class="rh-backtests-checks">
      <label>
        <input id="backtest-profit-lock-enabled" type="checkbox">
        <span data-i18n="backtests.field.profit_lock">{{ t("backtests.field.profit_lock") }}</span>
      </label>
      <label>
        <input id="backtest-close-on-end" type="checkbox" checked>
        <span data-i18n="backtests.field.close_on_end">{{ t("backtests.field.close_on_end") }}</span>
      </label>
      <label for="backtest-profit-lock-pct" data-i18n="backtests.field.profit_lock_pct">{{ t("backtests.field.profit_lock_pct") }}</label>
      <input id="backtest-profit-lock-pct" type="number" min="0" max="100" step="0.5" value="30">
    </div>
  </fieldset>

  <div class="rh-command-row rh-backtests-form-actions">
    <button class="rh-button rh-button--ghost" type="button" data-backtests-load-sample data-i18n="backtests.action.load_sample">
      {{ t("backtests.action.load_sample") }}
    </button>
    <button class="rh-button" type="button" data-backtests-preflight data-i18n="backtests.action.preflight">
      {{ t("backtests.action.preflight") }}
    </button>
    <button class="rh-button rh-button--primary" type="submit" data-backtests-create data-i18n="backtests.action.create">
      {{ t("backtests.action.create") }}
    </button>
  </div>
</form>
