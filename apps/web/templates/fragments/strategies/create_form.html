<form id="strategy-create-form" class="rh-strategy-form" data-strategy-create-form>
  <section class="rh-strategy-form__section" aria-labelledby="strategy-market-title">
    <div class="rh-section-heading">
      <h2 id="strategy-market-title" data-i18n="strategies.create.market_title">
        {{ t("strategies.create.market_title") }}
      </h2>
      <p data-i18n="strategies.create.market_body">{{ t("strategies.create.market_body") }}</p>
    </div>

    <div class="rh-form-grid">
      <label class="rh-field" for="strategy-market-id">
        <span data-i18n="strategies.fields.market">{{ t("strategies.fields.market") }}</span>
        <select id="strategy-market-id" name="market_id" required>
          <option value="" data-i18n="strategies.create.loading_markets">
            {{ t("strategies.create.loading_markets") }}
          </option>
        </select>
      </label>

      <label class="rh-field" for="strategy-symbol-query">
        <span data-i18n="strategies.fields.symbol">{{ t("strategies.fields.symbol") }}</span>
        <input
          id="strategy-symbol-query"
          name="symbol"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="BTCUSDT"
          required
        >
      </label>

      <label class="rh-field" for="strategy-timeframe">
        <span data-i18n="strategies.fields.timeframe">{{ t("strategies.fields.timeframe") }}</span>
        <select id="strategy-timeframe" name="timeframe" required>
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1d">1d</option>
        </select>
      </label>
    </div>

    <input id="strategy-symbol-value" type="hidden" name="selected_symbol">
    <p id="strategy-selected-symbol" class="rh-inline-help" data-i18n="strategies.create.no_symbol">
      {{ t("strategies.create.no_symbol") }}
    </p>
    <ul
      id="strategy-symbol-suggestions"
      class="rh-symbol-suggestions"
      aria-label="{{ t('strategies.create.symbol_suggestions') }}"
      data-i18n-aria-label="strategies.create.symbol_suggestions"
    ></ul>
  </section>

  <section class="rh-strategy-form__section" aria-labelledby="strategy-indicators-title">
    <div class="rh-section-heading">
      <h2 id="strategy-indicators-title" data-i18n="strategies.create.indicators_title">
        {{ t("strategies.create.indicators_title") }}
      </h2>
      <p data-i18n="strategies.create.indicators_body">
        {{ t("strategies.create.indicators_body") }}
      </p>
    </div>

    <div id="strategy-indicator-blocks" class="rh-indicator-stack"></div>

    <button id="strategy-add-indicator" class="rh-button rh-button--ghost" type="button">
      <span aria-hidden="true">+</span>
      <span data-i18n="strategies.create.add_indicator">
        {{ t("strategies.create.add_indicator") }}
      </span>
    </button>
  </section>

  <div class="rh-form-actions">
    <button id="strategy-create-submit" class="rh-button rh-button--primary" type="submit">
      <span data-i18n="strategies.create.submit">{{ t("strategies.create.submit") }}</span>
    </button>
    <a class="rh-button rh-button--ghost" href="/strategies" data-i18n="strategies.actions.cancel">
      {{ t("strategies.actions.cancel") }}
    </a>
  </div>
</form>
