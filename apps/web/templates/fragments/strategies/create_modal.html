<section
  class="strategies-create"
  data-strategy-create-panel
  hidden
  aria-label="{{ t('strategies.create.title') }}"
>
  <div class="strategies-create__shell">
    <header class="panel-heading panel-heading--with-tools">
      <h2>{{ t("strategies.create.title") }}</h2>
      <button
        class="rh-button rh-button--secondary rh-button--compact"
        type="button"
        data-strategy-create-close
      >{{ t("strategies.actions.close") }}</button>
    </header>
    <form class="strategies-create__form" data-strategy-create-form>
      <label>
        <span>{{ t("strategies.create.symbol") }}</span>
        <input name="symbol" value="BTCUSDT" autocomplete="off">
      </label>
      <label>
        <span>{{ t("strategies.create.market_id") }}</span>
        <input name="market_id" value="1" inputmode="numeric">
      </label>
      <label>
        <span>{{ t("strategies.create.instrument_key") }}</span>
        <input name="instrument_key" value="binance:spot:BTCUSDT" autocomplete="off">
      </label>
      <div class="strategies-create__inline">
        <div class="rh-dropdown strategies-dropdown" data-rh-dropdown data-rh-dropdown-kind="listbox">
          <button
            class="rh-button rh-button--secondary rh-button--compact rh-dropdown__trigger"
            type="button"
            id="strategy-create-market-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="strategy-create-market-menu"
            data-rh-dropdown-trigger
            data-strategy-control="branded dropdown"
          >
            {{ t("strategies.create.market_type") }}
            <span class="rh-dropdown__value" data-create-market-current>spot</span>
          </button>
          <div
            class="rh-popover"
            id="strategy-create-market-menu"
            role="listbox"
            hidden
            data-rh-dropdown-menu
          >
            <button class="rh-menu-item" type="button" role="option" aria-selected="true" data-create-market="spot">spot</button>
            <button class="rh-menu-item" type="button" role="option" aria-selected="false" data-create-market="futures">futures</button>
          </div>
        </div>
        <div class="rh-dropdown strategies-dropdown" data-rh-dropdown data-rh-dropdown-kind="listbox">
          <button
            class="rh-button rh-button--secondary rh-button--compact rh-dropdown__trigger"
            type="button"
            id="strategy-create-timeframe-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="strategy-create-timeframe-menu"
            data-rh-dropdown-trigger
            data-strategy-control="branded dropdown"
          >
            {{ t("strategies.create.timeframe") }}
            <span class="rh-dropdown__value" data-create-timeframe-current>1m</span>
          </button>
          <div
            class="rh-popover"
            id="strategy-create-timeframe-menu"
            role="listbox"
            hidden
            data-rh-dropdown-menu
          >
            {% for timeframe in ["1m", "5m", "15m", "1h", "4h", "1d"] %}
              <button
                class="rh-menu-item"
                type="button"
                role="option"
                aria-selected="{{ 'true' if timeframe == '1m' else 'false' }}"
                data-create-timeframe="{{ timeframe }}"
              >{{ timeframe }}</button>
            {% endfor %}
          </div>
        </div>
      </div>
      <label class="strategies-create__wide">
        <span>{{ t("strategies.create.signal_template") }}</span>
        <input name="signal_template" value="MA(20,50)" autocomplete="off">
      </label>
      <label class="strategies-create__wide">
        <span>{{ t("strategies.create.indicators") }}</span>
        <textarea name="indicators" rows="5">[{"name":"MA","params":{"fast":20,"slow":50}}]</textarea>
      </label>
      <p class="strategies-create__status" data-strategy-create-status aria-live="polite"></p>
      <footer class="strategies-create__actions">
        <button class="rh-button rh-button--secondary rh-button--compact" type="button" data-strategy-create-close>
          {{ t("strategies.actions.cancel") }}
        </button>
        <button class="rh-button rh-button--primary rh-button--compact" type="submit">
          {{ t("strategies.actions.create") }}
        </button>
      </footer>
    </form>
  </div>
</section>
