{% if current_user %}
  <span class="rh-user-badge" title="{{ current_user.user_id }}">
    <span class="rh-user-badge__level">{{ current_user.paid_level|upper }}</span>
    <span class="rh-user-badge__id">{{ current_user.user_id[:8] }}</span>
  </span>
{% else %}
  <span class="rh-user-badge rh-user-badge--guest">
    <span class="rh-user-badge__level">GUEST</span>
  </span>
{% endif %}
