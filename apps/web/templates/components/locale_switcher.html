<nav
  class="rh-locale-switcher"
  aria-label="{{ t('shell.language_aria') }}"
  data-locale-control
  data-i18n-aria-label="shell.language_aria"
>
  {% for locale in locale_options %}
    <a
      class="rh-locale-switcher__option{% if locale.active %} rh-locale-switcher__option--active{% endif %}"
      href="{{ locale.href }}"
      data-locale-option="{{ locale.key }}"
      data-i18n="locale.{{ locale.key }}"
      data-active="{{ 'true' if locale.active else 'false' }}"
      hreflang="{{ locale.key }}"
      {% if locale.active %}aria-current="true"{% endif %}
    >{{ locale.label }}</a>
  {% endfor %}
</nav>
