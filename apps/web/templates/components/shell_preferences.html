<div class="shell-preferences" aria-label="{{ t('common.preferences') }}">
  <div class="rh-dropdown rh-dropdown--compact" data-rh-dropdown data-rh-dropdown-kind="listbox">
    <button
      class="rh-button rh-button--compact rh-dropdown__trigger"
      type="button"
      id="{{ preference_id_prefix|default('shell') }}-theme-switcher-trigger"
      aria-label="{{ t('theme.label') }}"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-controls="{{ preference_id_prefix|default('shell') }}-theme-switcher-menu"
      data-rh-dropdown-trigger
    >
      <span class="rh-dropdown__value" data-theme-current>{{ t("theme.graphite") }}</span>
    </button>
    <div
      class="rh-popover rh-popover--theme"
      id="{{ preference_id_prefix|default('shell') }}-theme-switcher-menu"
      role="listbox"
      aria-labelledby="{{ preference_id_prefix|default('shell') }}-theme-switcher-trigger"
      hidden
      data-rh-dropdown-menu
      data-theme-menu
    >
      {% for theme in theme_options %}
        <button
          class="rh-menu-item rh-theme-option"
          type="button"
          role="option"
          aria-selected="{{ 'true' if theme.key == 'graphite' else 'false' }}"
          data-rh-dropdown-item="{{ theme.key }}"
          data-theme-option
          data-theme-value="{{ theme.key }}"
        >
          <span class="rh-theme-option__swatch" data-theme-swatch="{{ theme.key }}" aria-hidden="true"></span>
          <span>{{ t(theme.label_key) }}</span>
        </button>
      {% endfor %}
    </div>
  </div>

  <div class="rh-dropdown rh-dropdown--compact" data-rh-dropdown data-rh-dropdown-kind="listbox">
    <button
      class="rh-button rh-button--compact rh-dropdown__trigger"
      type="button"
      id="{{ preference_id_prefix|default('shell') }}-locale-switcher-trigger"
      aria-label="{{ t('common.language') }}"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-controls="{{ preference_id_prefix|default('shell') }}-locale-switcher-menu"
      data-rh-dropdown-trigger
    >
      <span class="rh-dropdown__value" data-locale-current>{{ locale|upper }}</span>
    </button>
    <div
      class="rh-popover"
      id="{{ preference_id_prefix|default('shell') }}-locale-switcher-menu"
      role="listbox"
      aria-labelledby="{{ preference_id_prefix|default('shell') }}-locale-switcher-trigger"
      hidden
      data-rh-dropdown-menu
      data-locale-menu
    >
      {% for option in language_options %}
        <button
          class="rh-menu-item"
          type="button"
          role="option"
          aria-selected="{{ 'true' if option.is_active else 'false' }}"
          data-rh-dropdown-item="{{ option.code }}"
          data-locale-option="{{ option.code }}"
          data-locale-url="{{ option.url }}"
        >{{ option.label }}</button>
      {% endfor %}
    </div>
  </div>
</div>
